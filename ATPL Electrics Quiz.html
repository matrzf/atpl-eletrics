n electric motor speeds up its back EMF increases."},{"n":11,"q":"The output of a shunt wound generator:","o":["will rise gradually as load is applied","will remain constant as load is applied","will vary with generator speed","will fall gradually as load is applied"],"a":1,"e":"The book's answer: the output of a shunt-wound generator stays roughly constant as the load increases."},{"n":12,"q":"Load shedding is:","o":["increasing circuit resistance","transferring the loads between generators","reducing the load voltage","overall reductions of the loads on the system"],"a":3,"e":"Load shedding is an overall reduction of the loads on the system."},{"n":13,"q":"An inertia switch on an aircraft will operate:","o":["when selected by the pilot or flight engineer","automatically in flight","during an emergency or crash landing","in flight only"],"a":2,"e":"An inertia switch works automatically in an emergency or crash landing, not in normal flight."},{"n":14,"q":"The purpose of electrical bonding on aircraft is:","o":["to directly earth the positive lead","to prevent compass malfunctioning and to gather local static charges","to isolate all components electrically and therefore make the static potential constant","to provide a low resistance path for earth return circuits and safely dissipate local static charges and lightning strikes"],"a":3,"e":"Bonding gives a low resistance path for earth returns and safely dissipates static charges and lightning strikes."},{"n":15,"q":"Electrical components of aircraft systems are screened to:","o":["bond the circuit to reduce risk of fire","prevent them interfering with the function of radio equipment","prevent short circuits interfering with aircraft equipment","prevent engine malfunctions"],"a":1,"e":"Components are screened to avoid interfering with radio equipment."}]}]},{"id":"11","title":"Introduction to AC","grp":"AC","sections":[{"name":"Questions","qs":[{"n":1,"q":"The impedance of a circuit:","o":["is the AC inductive load","is the DC inductive load","is the total resistance in an AC circuit","is the highest resistance of a rectifier"],"a":2,"e":"Impedance (Z) is the total opposition to current in an AC circuit: resistance plus reactance combined."},{"n":2,"q":"The ratio of true power to apparent power is known as:","o":["ohms","the power factor","kVAs","the RMS value"],"a":1,"e":"Power factor = true power / apparent power (kW / kVA)."},{"n":3,"q":"In a constant frequency AC supply system, the frequency is determined by:","o":["the generator drive speed and the number of poles","engine drive speed and the power factor","the capacitive reactance","the impedance"],"a":0,"e":"Frequency depends on the generator drive speed and the number of poles: f = poles × RPM / 120."},{"n":4,"q":"The amount of electrical power output for a given generator weight is:","o":["dependent on the aircrafts power requirements","greater for a DC generator","greater for an AC generator","determined by the size of the aircraft"],"a":2,"e":"For the same weight, an AC generator gives more power than a DC generator."},{"n":5,"q":"The frequency of a supply is quoted in:","o":["cycles or hertz","watts","megacycles","cycles / minute"],"a":0,"e":"Frequency is quoted in cycles per second, called hertz (Hz)."},{"n":6,"q":"One advantage that AC has over DC is:","o":["that TRUs are not required","that the generators require less cooling","that the cables require less insulation","the ease with which the voltage can be stepped up or down with almost 100% efficiency"],"a":3,"e":"AC voltage can be stepped up or down by a transformer with almost no loss, which DC cannot do easily."},{"n":7,"q":"The voltage output of an AC generator will rise to a maximum value:","o":["in one direction, fall to zero and rise in the same direction","in one direction and remain there","in one direction, fall to zero and rise to a maximum value in the opposite direction","in one direction only"],"a":2,"e":"AC rises to a maximum in one direction, falls to zero, then rises to a maximum in the opposite direction."},{"n":8,"q":"If the frequency in an inductive circuit is less than it was designed for, then current consumption will:","o":["decrease","remain the same","fluctuate","increase"],"a":3,"e":"Inductive reactance is XL = 2πfL. If frequency drops, XL drops and the current increases."},{"n":9,"q":"In a capacitive circuit, if the frequency increases:","o":["current decreases","current increases","current flow is unaffected by frequency change","the voltage fluctuates"],"a":1,"e":"Capacitive reactance is XC = 1 / (2πfC). If frequency rises, XC falls and the current increases."},{"n":10,"q":"The line voltage of a typical aircraft constant frequency paralleled AC system is:","o":["115","208","200","400"],"a":2,"e":"The book's answer is 200 V for the line voltage (the common 115/200 V system). 115 V is the phase voltage."},{"n":11,"q":"A 400 Hz supply has:","o":["an output capacity of 400000 watts","an impedance of 400 ohms","a frequency of 400 cycles per second","a frequency of 400 cycles per minute"],"a":2,"e":"400 Hz means 400 cycles per second."},{"n":12,"q":"In an AC circuit which is mainly inductive:","o":["current will lead voltage","current and voltage will be in phase","current will lag voltage","the power factor will be negative"],"a":2,"e":"In an inductive circuit the current lags behind the voltage."},{"n":13,"q":"If the frequency is increased in an inductive circuit:","o":["reactance will increase","reactance will decrease","impedance will remain constant","the heating effect will increase"],"a":0,"e":"XL = 2πfL, so raising the frequency raises the inductive reactance."},{"n":14,"q":"The RMS value of alternating current is:","o":["the mean current value for one half cycle","1.73 times the peak value","equal to the square root of the peak value",".707 times the peak value"],"a":3,"e":"RMS = 0.707 × peak value, the DC value giving the same heating effect."},{"n":15,"q":"The number of separate stator windings in an AC generator determines:","o":["the output voltage of the supply","the output frequency of the supply","the power factor","the number of phases present in the supply"],"a":3,"e":"The number of separate stator windings sets the number of phases."},{"n":16,"q":"kVAR is a measure of:","o":["the resistive load on the alternator","the reactive load on the alternator","the total load on the alternator","the total circuit impedance"],"a":1,"e":"kVAR measures reactive load, the part of the load that does no real work."},{"n":17,"q":"The output of an alternator is rated in:","o":["kVA","kVAR","kW","kW/kVAR"],"a":0,"e":"An alternator is rated in kVA (apparent power), since it must carry both real and reactive current."},{"n":18,"q":"Instruments measuring AC are calibrated in:","o":["RMS values","average values","peak values","mean values"],"a":0,"e":"AC instruments are calibrated in RMS values, which give the equivalent DC heating effect."},{"n":19,"q":"Impedance is the:","o":["vector sum of the resistance and the reactance","sum of the resistance and capacitive reactance","sum of the capacitive reactance and the inductive reactance","sum of the resistance, inductive reactance and the capacitive reactance"],"a":0,"e":"Impedance is the vector (not simple) sum of resistance and reactance."},{"n":20,"q":"If an alternator is run at below normal frequency, then:","o":["electric motors will stop","inductive devices will overheat","lights will become dim","lights will become brighter"],"a":1,"e":"At low frequency, inductive reactance drops and current rises, so inductive devices (motors, transformers) overheat."},{"n":21,"q":"The power factor is:","o":["kVA / kW","kW / kVAR","kW / kVA","kVAR / kW"],"a":2,"e":"Power factor = kW / kVA (real power divided by apparent power)."},{"n":22,"q":"When reactance is present in a circuit:","o":["the power factor will be unity","the power factor will be negative","the power factor will be greater than unity","the power factor will be less than one"],"a":3,"e":"When reactance is present, current and voltage are out of phase and the power factor is below 1 (unity)."},{"n":23,"q":"Generator output frequency is decreased by decreasing the:","o":["generator field rotation speed","generator field voltage","generator field current","generator field impedance"],"a":0,"e":"Frequency depends on rotation speed, so slowing the generator field rotation lowers the frequency."},{"n":24,"q":"The RMS value of AC is:","o":["1.73 times the peak value","the peak value times the power factor","the peak value which would provide the same heating effect as DC","the value of DC which would provide the same heating effect"],"a":3,"e":"The RMS value of AC is the DC value that would produce the same heating effect."},{"n":25,"q":"In a reactive circuit:","o":["the voltage and current will be out of phase","the voltage and current will be in phase opposition","the voltage will always be led by the current","the voltage and current will be in phase"],"a":0,"e":"In a reactive circuit, voltage and current are out of phase."},{"n":26,"q":"A capacitor consists of two metal plates:","o":["separated by a diabetic","which have current flowing between them","which will not allow a potential difference between them","separated by waxed paper or mica"],"a":3,"e":"A capacitor is two metal plates separated by an insulator (dielectric) such as waxed paper or mica."},{"n":27,"q":"In a DC circuit, an inductance:","o":["never has any effect on the voltage","only affects the voltage upon switching on","offers opposition to the flow while switching on and off","will always increase the voltage"],"a":2,"e":"An inductance opposes any change of current, so it resists the current both when switching on and off."},{"n":28,"q":"The basic unit of inductance is:","o":["the henry","the ohm","the farad","the coulomb"],"a":0,"e":"The unit of inductance is the henry. The farad is for capacitance, the ohm for resistance."},{"n":29,"q":"In an inductive circuit:","o":["current leads the voltage","current lags the voltage","the voltage is in phase with the current","only the RMS values vary"],"a":1,"e":"In an inductive circuit the current lags the voltage."},{"n":30,"q":"In a capacitive circuit, if the frequency increases then:","o":["current flow is unaffected","the voltage varies","current flow decreases","current flow increases"],"a":3,"e":"In a capacitive circuit, XC falls as frequency rises, so more current flows."},{"n":31,"q":"The power factor is:","o":["WATTFUL POWER / REAL POWER","RATED POWER / APPARENT POWER","APPARENT POWER / TRUE POWER","REAL POWER / APPARENT POWER"],"a":3,"e":"Power factor = real power / apparent power."},{"n":32,"q":"Transferring electrical energy by means of a magnetic field is called:","o":["electrostatic induction","electromolecular induction","electromagnetic induction","electromolecular amplification"],"a":2,"e":"Transferring energy between windings through a magnetic field is electromagnetic induction (how a transformer works)."}]}]},{"id":"12","title":"Alternators","grp":"AC","sections":[{"name":"Questions","qs":[{"n":1,"q":"An alternator is:","o":["a reversing input switch","an AC generator","a DC generator","a static inverter"],"a":1,"e":"An alternator is an AC generator."},{"n":2,"q":"To prevent high circulating currents between paralleled alternators, the following conditions should be met:","o":["their voltage and frequency must be the same","their frequencies must be identical and their phase sequence must be the same","their voltage, frequency, phase and phase sequence must all be the same","their inductive and capacitive reactances must match exactly"],"a":2,"e":"Paralleled alternators need the same voltage, frequency, phase and phase sequence, or large circulating currents flow."},{"n":3,"q":"The output of an AC generator is taken from:","o":["the exciter windings","the field coils","the stator windings","the rotor coils"],"a":2,"e":"The output comes from the stator windings (the stationary part), not from the rotor."},{"n":4,"q":"The moving part of an alternator is:","o":["the rotor","the megacycle","the stator","the frequency"],"a":0,"e":"The rotor is the moving part of an alternator. The stator is stationary."},{"n":5,"q":"A frequency wild alternator must be:","o":["paralleled","a rotating magnet type","self-exciting","unparalleled"],"a":3,"e":"A frequency wild alternator has a varying speed, so it cannot be paralleled with others."},{"n":6,"q":"In a 3 phase AC generator circuit, the phase voltage is:","o":["greater than line voltage","10% higher than line voltage","less than line voltage","equal to line voltage"],"a":2,"e":"In a star connection, phase voltage = line voltage / √3, so phase voltage is lower than line voltage (115 V against 200 V)."},{"n":7,"q":"If an alternator output is frequency wild, it would normally be used for:","o":["flight instruments","charging a battery","all AC equipment","prop and engine de-icing systems"],"a":3,"e":"Frequency wild AC is only used for loads that do not care about frequency, such as heating (de-icing)."},{"n":8,"q":"The generator output voltage is increased by:","o":["putting more load on it","the frequency controller","decreasing the generator field voltage","increasing the generator field current"],"a":3,"e":"Output voltage goes up when the generator field current is increased."},{"n":9,"q":"A constant frequency AC supply in an aircraft with only frequency wild generators is provided by:","o":["an inverter","a diode","an autotransformer","a rectifier"],"a":0,"e":"An inverter turns DC into AC at constant frequency."},{"n":10,"q":"An alternator normally used to supply an aircraft’s power system would be:","o":["single phase","three phase","two phase","frequency wild"],"a":1,"e":"The main aircraft alternator is three phase."},{"n":11,"q":"A permanent magnet in a rotating field generator:","o":["provides for initial excitation of the field","controls the amount of excitation in the stator windings","provides the initial excitation in the voltage regulator","can be flashed by the application of alternating current"],"a":0,"e":"The permanent magnet supplies the initial excitation to start the field building up."},{"n":12,"q":"Voltage control of an alternator output is achieved by varying the:","o":["excitation of the rotating commutator","load current","excitation of the rotating field","power factor"],"a":2,"e":"Alternator voltage is controlled by varying the excitation (current) of the rotating field."},{"n":13,"q":"Frequency wild AC is produced when:","o":["a transformer winding open circuits","the voltage regulator is malfunctioning","the rotational speed of the generator varies","the alternator becomes angry"],"a":2,"e":"Frequency wild AC results when the rotation speed of the generator varies with engine speed."},{"n":14,"q":"In a star connected supply system:","o":["line and phase current are equal","line current is greater than phase current","line current is less than phase current","phase current is 0.707 times line current"],"a":0,"e":"In a star connection, line current = phase current. The line voltage is √3 times the phase voltage."},{"n":15,"q":"In a 3 phase supply system, line voltage would be sensed between the:","o":["phases only","phase and earth","phase and neutral","phases and earth"],"a":0,"e":"Line voltage is measured between two phases."},{"n":16,"q":"One advantage of three phase generation over single phase generation is that:","o":["most aircraft services require a three phase supply","it can be more easily transformed into DC","it gives more compact generators and allows lower cable weights","the power factor is much lower"],"a":2,"e":"Three phase gives more compact generators and lighter cables for the same power."},{"n":17,"q":"In a typical aircraft constant frequency supply system, the phase voltage is:","o":["200","115","208","400"],"a":1,"e":"The phase voltage of the standard system is 115 V (200 V line to line)."},{"n":18,"q":"An alternator with its output taken from its stationary armature, has:","o":["a stationary field","its field excitation fed directly to the armature","AC excitation","a rotating field"],"a":3,"e":"If the output is taken from the stationary armature, the field is the rotating part. This is a rotating field alternator."},{"n":19,"q":"The phase voltage in a star wound three phase system is measured between:","o":["phase and neutral","two phases","two lines","neutral and earth"],"a":0,"e":"Phase voltage in a star system is measured between one phase and the neutral."},{"n":20,"q":"If one phase of a star wound three phase system becomes earthed, it will:","o":["earth all three phases","cause a large current to flow in the neutral","have no effect on the other phases","cause a reduction in the frequency of the supply"],"a":1,"e":"An earth fault on one phase of a star system makes a large current flow through the neutral/earth path."},{"n":21,"q":"The alternators fitted in an aircraft’s main power supply system would normally be:","o":["brushed self-excited machines","frequency wild","self-excited","externally excited"],"a":2,"e":"Main alternators are self-excited (brushless) so no external excitation source is needed."},{"n":22,"q":"A voltage regulator works by:","o":["sensing the battery voltage","assessing the impedance of the circuit","varying the circuit voltage","varying the rotating field strength"],"a":3,"e":"A voltage regulator holds voltage steady by varying the strength of the rotating field."},{"n":23,"q":"To ensure correct load sharing on paralleled alternators:","o":["both real and reactive loads should be balanced","actual loads should be the same","reactive loads should be the same","the load impedance should be constant"],"a":0,"e":"Both real (kW) and reactive (kVAR) loads must be balanced between paralleled alternators."},{"n":24,"q":"Reactive load sharing is achieved by:","o":["altering the loads on the bus bars","varying the generator rotational speed","varying the generator field current","altering the CSDU output torque"],"a":2,"e":"Reactive load sharing is done by varying the generator field current."},{"n":25,"q":"Real load sharing is achieved by:","o":["varying the alternator rotational speed","varying the generator field current","altering the loads on the bus bar","the voltage regulator"],"a":0,"e":"Real load sharing is done by varying the alternator rotational speed (drive torque)."},{"n":26,"q":"The phase relationship of paralleled generators should be:","o":["unimportant","180° apart","synchronous","120° apart"],"a":2,"e":"Paralleled generators must be in phase (synchronous)."},{"n":27,"q":"In a constant speed parallel operation alternator system:","o":["each alternator has its own constant speed drive unit","all engines are run at the same speed","all alternators are driven by the same engine","engine speed is governed by the constant speed drive unit"],"a":0,"e":"In a constant speed parallel system each alternator has its own constant speed drive unit (CSDU)."},{"n":28,"q":"An aircraft’s constant frequency supply is maintained at:","o":["between 350 - 450 Hz","between 380 - 420 Hz","between 115 - 200 Hz","between 395 - 495 Hz"],"a":1,"e":"The book's answer: a constant frequency supply is kept within 380 to 420 Hz (nominal 400 Hz)."},{"n":29,"q":"For a modern aircraft powered by an AC system, the ground power unit must supply:","o":["28 volts AC only","200 volts","115 volts, three phase","115/200 volts, three phase, 400 Hz"],"a":3,"e":"The ground power unit must supply 115/200 V, three phase, 400 Hz, like the aircraft generators."},{"n":30,"q":"Oil for the operation of a CSDU is:","o":["supplied from the engine oil system","a separate self-contained supply","drawn from a common tank for all CSDUs","only required for lubrication purposes"],"a":1,"e":"The CSDU oil system is a separate, self-contained supply, not shared with the engine."},{"n":31,"q":"Malfunction of a CSDU requires:","o":["automatic electrical disconnection of the drive at any time in flight","that the input drive will shear on the ground only","operation of the drive disconnect switch at any time in flight","operation of the drive disconnect switch on the ground only"],"a":2,"e":"The drive disconnect switch can be operated at any time in flight but the drive can only be reset on the ground."},{"n":32,"q":"Before two constant frequency AC generators can be connected in parallel:","o":["their frequency, phase, phase sequence and voltage must match, and a means of automatic real and reactive load sharing must be available","real and reactive loads must match. Frequency, phase and voltage must be within limits","the synchronization lights on the alternator control panel must be fully bright","suitable control arrangements must exist for the sharing of real and reactive loads. These will correct any phase or frequency error existing at the time of connection"],"a":0,"e":"To parallel two generators, frequency, phase, phase sequence and voltage must match, with automatic real and reactive load sharing available."},{"n":33,"q":"The generator control relay (GCR) is:","o":["in the excitation circuit","between the alternator and its load bus bar","in the stator circuit","between the load bus bar and the synchronous bus bar"],"a":0,"e":"The generator control relay (GCR) is in the excitation circuit, so it can switch the field on and off."},{"n":34,"q":"The running excitation current for an alternator is:","o":["AC","DC from the aircraft batteries","DC from the static inverter","DC which is rectified AC and could be from a separate excitation generator on the main rotor shaft"],"a":3,"e":"The running excitation current is DC (rectified AC), often from an exciter on the main rotor shaft."},{"n":35,"q":"If each phase of a three phase star wound system has a phase voltage of 115 volts, the voltage obtained by bridging two phase would be:","o":["200 volts AC","173 volts DC","28 volts DC","173 volts AC"],"a":0,"e":"Line voltage = √3 × phase voltage = 1.73 × 115 ≈ 200 V AC."},{"n":36,"q":"Protection from ‘earth’ faults and ‘line to line’ faults is given by:","o":["a negative earth detector","a fault protection system including a differential protection monitor","the synchronization unit","reactive load sharing circuits"],"a":1,"e":"Earth faults and line-to-line faults are covered by the fault protection system, including a differential protection monitor."},{"n":37,"q":"Warnings of CSDU oil overheat are given in the cockpit by:","o":["audio warning","an ‘oil overheat’ warning light","a ‘low oil pressure’ warning light","a temperature gauge"],"a":1,"e":"CSDU oil overheating gives an \"oil overheat\" warning light in the cockpit."},{"n":38,"q":"One disadvantage of parallel operation is that:","o":["faults can propagate, and any error in supply can affect all services","the system is less flexible due to the need for additional control and protection circuits","the greater load on the CSDUs means that their power / weight ratio is much reduced","there is a considerable increase in complexity compared with a non-paralleled system, due to the need for CSDUs and load sharing circuits"],"a":3,"e":"The main drawback of parallel operation is the added complexity: CSDUs and load sharing circuits are needed."},{"n":39,"q":"Alternators in parallel operation require the maintenance of constant frequency and phase synchronization to:","o":["balance the battery voltage when more than one battery is being used","prevent recirculating currents","control their voltage","reduce their magnetic fields"],"a":1,"e":"Constant frequency and phase synchronisation prevent circulating currents between paralleled alternators."},{"n":40,"q":"The APU generator can only be used when:","o":["another generator is on line","the aircraft is on the ground","the bus bars are being fed from another source","when no other power source is feeding the bus bar"],"a":3,"e":"The APU generator may only be used when no other source is feeding the bus bar."},{"n":41,"q":"The purpose of the differential protection circuit in a three phase AC system is:","o":["to compare alternator output current to bus bar current","to compare on and off load currents","to compare the alternators reactive load to its real load","to compare the CSDU efficiency ratings"],"a":0,"e":"Differential protection compares each alternator's output current with the current reaching the bus bar, and detects a fault between them."},{"n":42,"q":"An alternator driven by a CSDU","o":["can never be paralleled","will require a voltage controller","will require a lubrication system separated from its drive oil system","will not require a voltage controller"],"a":1,"e":"An alternator on a CSDU needs a voltage controller (regulator) for its output voltage."},{"n":43,"q":"In the event of a mechanical malfunction of the alternator:","o":["the drive disconnect unit will automatically separate the CSDU from the alternator","the real load will be adjusted to compensate","the quill drive will fracture","the CSDU oil temperature will decrease"],"a":2,"e":"On a mechanical alternator failure, the quill drive shears so the CSDU is protected."},{"n":44,"q":"The load meter, upon selection to “kVAR” would indicate:","o":["total power available","reactive loads","active loads","only DC resistive loads"],"a":1,"e":"In kVAR position the load meter reads the reactive load."},{"n":45,"q":"Disconnection of the CSDU in flight would be advisable if:","o":["the frequency meter indicated a discrepancy of greater than 5 Hz between alternators","there was an over or under voltage","the oil temperature was high or the oil pressure was low","the engine failed"],"a":2,"e":"Disconnect the CSDU in flight if its oil temperature is high or oil pressure low, to prevent damage."},{"n":46,"q":"To increase the real load taken by a paralleled AC generator, the:","o":["generator drive torque is increased","generator excitation is increased","generator dr d"],"a":3,"e":"Real load rises when the alternator's drive torque is increased, not its excitation."},{"n":65,"q":"An earth fault on a bus bar of a parallel generator system:","o":["would require that the appropriate GCB should open","would require that the appropriate BTB should open","would require that both the appropriate GCB and BTB should open","would require that all alternators should operate independently"],"a":2,"e":"An earth fault on a bus bar needs both the generator circuit breaker (GCB) and the bus tie breaker (BTB) to open to isolate it."}]}]},{"id":"13","title":"Practical Aircraft Systems","grp":"AC","sections":[{"name":"Questions","qs":[{"n":1,"q":"The purpose of a synchronizing bus bar is to:","o":["enable interconnections to be made between generator bus bars","supply essential services","monitor on load currents","interconnect DC bus bars"],"a":0,"e":"A synchronising bus bar interconnects the generator bus bars."},{"n":2,"q":"Fuses and circuit breakers are fitted:","o":["in DC circuits only","in both AC and DC circuits","in AC circuits only","only to protect the wiring"],"a":1,"e":"Fuses and circuit breakers are used in both AC and DC circuits."},{"n":3,"q":"Where the aircraft’s main electrical supply is AC, DC requirements are met by:","o":["batteries","TRUs","inverters","a static inverter"],"a":1,"e":"With an AC main supply, DC comes from transformer rectifier units (TRUs)."},{"n":4,"q":"In a split bus system using non-paralleled constant frequency alternators as the primary power source:","o":["essential AC loads are supplied directly from No. 1 AC bus bar","essential AC loads are supplied directly from No. 2 AC bus bar","only non-essential AC loads are supplied from the AC bus bars","essential AC loads are normally supplied from No. 1 AC bus bar via the changeover relay"],"a":3,"e":"Essential AC loads are normally supplied from No. 1 AC bus bar through a changeover relay."},{"n":5,"q":"In a split bus system using non-paralleled constant frequency alternators as the primary power source, if both alternators fail:","o":["all non-essential services are lost","all non-essential services will be supplied direct from the battery bus bar","all non-essential services will be supplied from the static inverter","essential DC consumers only will be supplied from the No. 1 TRU, all other DC services will be lost"],"a":0,"e":"If both alternators fail, all non-essential services are lost. Essential services stay on the static inverter."},{"n":6,"q":"In normal operation, the split bus bar AC system takes its DC supply from:","o":["two TRUs which are always isolated","a battery which is supplied from No. 1 TRU only","two TRUs which are connected together by the isolation relay","the static inverter"],"a":2,"e":"In normal operation the two TRUs are connected together by the isolation relay."},{"n":7,"q":"The static inverter in the split bus system supplies:","o":["the essential DC consumers","the essential AC consumers","both essential and non-essential consumers","the batteries"],"a":1,"e":"The static inverter supplies the essential AC consumers from the battery."},{"n":8,"q":"In the split bus system, the AC bus bars:","o":["are automatically connected via the isolation relay if one alternator fails","are automatically connected via the bus tie breaker if one alternator fails","can be connected together by switch selection if one alternator fails","can never be connected together because there is no load sharing circuit"],"a":1,"e":"The bus tie breaker (BTB) automatically joins the AC bus bars if one alternator fails."},{"n":9,"q":"With parallel generator operation:","o":["there are two synchronizing bus bars which are normally kept isolated","the GCBs connect the generators to the synchronizing bus bar","the BTBs connect the synchronizing bus bars together","the GCRs connect the generators to their load bus bars"],"a":0,"e":"In parallel operation there are two synchronising bus bars, normally kept isolated from each other."},{"n":10,"q":"In a parallel alternator operation, should one alternator fail, then:","o":["the other alternators can be selected to supply its load","the failed alternator’s loads will not be supplied","the GCB of the failed alternator will remain closed to allow its loads to be supplied by the remaining alternators","the SSB will close allowing the three remaining alternators to share all of the load"],"a":3,"e":"If one alternator fails, the synchronising bus bar (SSB) closes so the remaining alternators share all the load."},{"n":11,"q":"If external power is plugged into an aircraft which utilizes the split bus system of power distribution, then:","o":["it will automatically parallel itself with any alternators already on line","it will only supply non-essential AC consumers","it will supply all the aircraft services","essential AC consumers will be supplied from the static inverter"],"a":2,"e":"External power supplies all the aircraft services in a split bus system."}]}]},{"id":"14","title":"Transformers","grp":"AC","sections":[{"name":"Questions","qs":[{"n":1,"q":"Instrument transformers normally:","o":["convert 14 volts DC to 26 volts AC","reduce the AC supply to 26 volts for some instruments","change 115 volts to 200 volts for engine instruments","convert 28 volts DC to 28 volts AC"],"a":1,"e":"Instrument transformers step the AC supply down to 26 V for some instruments."},{"n":2,"q":"An autotransformer:","o":["varies its turns ratio automatically to maintain a constant output voltage with varying input voltage","has only one coil which is used as both primary and secondary","will maintain a constant output frequency with a varying supply frequency","requires an inductive supply"],"a":1,"e":"An autotransformer has only one coil, used as both primary and secondary."},{"n":3,"q":"A step up transformer is one in which the number of turns on the secondary winding is:","o":["the same as the primary if the cable diameter is the same","greater than that on the se","overheat the stator windings","stall the motor"],"a":1,"e":"Reversing any two phases reverses the direction of the rotating field, so the motor runs in reverse."},{"n":3,"q":"A synchronous motor runs at a speed that depends upon the supply:","o":["voltage","current","reactance","frequency"],"a":3,"e":"A synchronous motor runs at a speed set by the supply frequency (and number of poles)."},{"n":4,"q":"If one phase of the supply to a three phase motor fails, then:","o":["the motor will continue to run at the same speed","will slow down and stop","will stop immediately","will run at about half speed but will not start on its next selection"],"a":3,"e":"The book's answer: if a phase fails, the motor runs at about half speed and will not restart (single phasing)."},{"n":5,"q":"The basic principle of operation of a 3 phase induction motor is:","o":["a rotating field created in the rotor","a rotating field created in the stator","a stationary field created in the stator","a stationary field created in the rotor"],"a":1,"e":"A three phase induction motor works by a rotating magnetic field created in the stator."},{"n":6,"q":"In an induction motor:","o":["the rotor is star connected","magnetic fields blend evenly with one another","AC is induced in the rotor","a DC supply produces DC in the rotor"],"a":2,"e":"In an induction motor, AC is induced in the rotor by the stator's rotating field."},{"n":7,"q":"In a synchronous motor, the rotor is:","o":["energized by DC and it lines up with the magnetic field in the stator","wave wound","both AC and DC energized","impeded by the AC induced into it"],"a":0,"e":"The synchronous motor rotor is fed with DC and locks onto the rotating stator field."},{"n":8,"q":"An induction motor has:","o":["slip rings and brushes","a commutator","no slip ring or brushes","slip rings but no brushes"],"a":2,"e":"An induction motor has no slip rings or brushes, as the rotor current is induced."},{"n":9,"q":"A squirrel cage rotor:","o":["is not connected to the supply","is expensive to produce","rotates at exactly synchronous speed","is a closed circuit of high resistance"],"a":0,"e":"A squirrel cage rotor is not connected to the supply. Current is induced in it."},{"n":10,"q":"A starting circuit for a powerful single phase induction motor might be:","o":["a capacitance starter","a resistance / inductance starter","a cartridge starter","a bump starter"],"a":1,"e":"The book's answer: a powerful single phase induction motor may use a resistance/inductance (split phase) starter."}]}]},{"id":"17","title":"Logic Gates","grp":"AC","sections":[{"name":"Questions","qs":[{"n":1,"q":"The logic function of the circuit shown is:","o":["‘AND’","‘OR’","‘NOR’","‘NOT’"],"a":1,"f":"missing","e":"This question uses a circuit drawing in the book that is not available here. The book's answer is OR."},{"n":2,"q":"The circuit shown here represents:","o":["an ‘AND’ gate","a ‘NOR’ gate","an ‘OR’ gate","an ‘EXCLUSIVE OR’ gate"],"a":0,"f":"missing","e":"This question uses a circuit drawing in the book that is not available here. The book's answer is an AND gate."},{"n":3,"q":"The diagram is the equivalent of which of the accompanying symbols:","o":["Symbol a","Symbol b","Symbol c","Symbol d"],"a":2,"f":"missing","e":"This question uses symbols drawn in the book that are not available here. The book's answer is symbol c."},{"n":4,"q":"The gate symbols shown are:","o":["‘AND’ and ‘NAND’","‘EXCLUSIVE OR’ and ‘EXCLUSIVE NOR’","‘OR’ and ‘NOR’","‘OR’ and ‘EXCLUSIVE OR’"],"a":0,"f":"missing","e":"This question uses symbols drawn in the book that are not available here. The book's answer is AND and NAND."},{"n":5,"q":"A gate which requires that all inputs must be HIGH to obtain an output would be:","o":["a ‘NOR’ gate","an ‘OR’ gate","an ‘AND’ gate","a ‘NOT’ gate"],"a":2,"e":"An AND gate gives an output only when all its inputs are high."},{"n":6,"q":"This diagram represents:","o":["an inverter","an ‘AND’ gate","an ‘EXCLUSIVE NOR’ gate","an ‘OR’ gate"],"a":3,"f":"missing","e":"This question uses a diagram in the book that is not available here. The book's answer is an OR gate."},{"n":7,"q":"To obtain logic ‘0’ at output ‘Z’ there must be:","o":["logic ‘1’ at ‘X’ and logic ‘0’ at ‘Y’","logic ‘0’ at ‘X’ and logic ‘1’ at ‘Y’","logic ‘1’ at ‘X’ and logic ‘1’ at ‘Y’","logic ‘0’ at ‘X’ and logic ‘0’ at ‘Y’"],"a":2,"f":"missing","e":"The output is 0 only when both inputs are 1. This is a NAND gate."},{"n":8,"q":"A transistor:","o":["can only be used as an amplifier","can be used as a demi-conductor to act as an automatic switch or an amplifier","is an inverted silicon controlled rectifier","can be used as a semiconductor to act as an automatic switch or an amplifier"],"a":3,"e":"A transistor is a semiconductor that can act as an automatic switch or an amplifier. \"Demi-conductor\" is wrong."},{"n":9,"q":"A transistor:","o":["is made up of crystals in the arrangement of emitter, base and collector","is made up of crystals in the arrangement of emitter, collector and base","is made up of crystals in the arrangement of collector, emitter and base","requires a current of ten amps through the base to transmit"],"a":0,"e":"A transistor is built from three layers in the order emitter, base, collector."},{"n":10,"q":"A gate with only one input and one output:","o":["cannot be a ‘double’ gate","is a ‘NOT’ gate","can only be a ‘semi-gate’","cannot be a ‘NOT’ gate"],"a":1,"e":"A gate with one input and one output is a NOT gate (inverter)."},{"n":11,"q":"The two most commonly used gates are:","o":["‘NOT’ and ‘NOR’","‘OR’ and ‘EXCLUSIVE AND’","‘AND’ and ‘OR’","‘AND’ and ‘NAND’"],"a":2,"e":"The two most commonly used gates are AND and OR."},{"n":12,"q":"Truth tables illustrate the relationship between:","o":["inputs and outputs","integrated gates for trouble shooting","the sequence of operation of the gates","electronic and electrical circuits"],"a":0,"e":"A truth table lists the output for every combination of inputs."},{"n": const LS_KEY = "atpl-elec-progress-v1";

const GROUPS = { DC: "Direct current (DC)", AC: "Alternating current (AC)" };

/* ---------- Index ---------- */
const Q = {};
DATA.forEach(function (ch) {
  ch.ids = [];
  ch.sections.forEach(function (s, si) {
    s.qs.forEach(function (q) {
      q.id = "c" + ch.id + "_" + si + "_" + q.n;
      q.ch = ch; q.sec = s.name; q.si = si;
      Q[q.id] = q; ch.ids.push(q.id);
    });
  });
});
const ALL_IDS = DATA.reduce(function (a, ch) { return a.concat(ch.ids); }, []);

/* ---------- Progress store (answers: id -> [choice, time]; choice -1 = cleared) ---------- */
let P = {};
try { P = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { P = {}; }
function getAns(id) { const v = P[id]; return v && v[0] >= 0 ? v[0] : null; }
let syncState = "local";
let dbDoc = null, pushTimer = null, pushing = false, dirty = false;
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {} }
function persist() { saveLocal(); schedulePush(); }
function schedulePush() {
  if (!dbDoc) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 1200);
}
async function push() {
  if (!dbDoc) return;
  if (pushing) { dirty = true; return; }
  pushing = true;
  try { await dbDoc.set({ v: 1, p: P, t: Date.now() }); syncState = "cloud"; }
  catch (e) { syncState = "error"; }
  pushing = false;
  paintSync();
  if (dirty) { dirty = false; schedulePush(); }
}
function paintSync() {
  const el = document.getElementById("syncnote");
  if (!el) return;
  el.textContent = syncState === "cloud"
    ? "Progress is saved to your account, so you can pick it up on any device."
    : syncState === "error"
    ? "Saving online failed. Your progress is still saved on this device."
    : "Progress is saved on this device only.";
}
async function initSync() {
  try {
    if (!window.claude || !claude.use) return;
    const user = await claude.use("user");
    const db = await claude.use("db");
    if (!user || !db) return;
    const uid = await user.id();
    if (!uid) return;
    dbDoc = db.doc("data/users/" + uid + "/progress");
    const snap = await dbDoc.get();
    let changed = false, needPush = false;
    const rem = snap.exists ? ((snap.data() || {}).p || {}) : {};
    Object.keys(rem).forEach(function (k) {
      if (!Q[k]) return;
      if (!P[k] || rem[k][1] > P[k][1]) { P[k] = rem[k]; changed = true; }
    });
    Object.keys(P).forEach(function (k) { if (!rem[k] || P[k][1] > rem[k][1]) needPush = true; });
    syncState = "cloud";
    saveLocal();
    if (needPush) schedulePush();
    if (S.run && S.run.kind === "chapter") fillRun(S.run);
    render();
  } catch (e) { /* stay local */ }
}

/* ---------- State ---------- */
const S = { view: "home", run: null, scope: "all", confirm: null };
function chapterById(id) { return DATA.filter(function (c) { return c.id === id; })[0]; }
function fillRun(run) {
  run.ans = {};
  run.ids.forEach(function (id) { const a = getAns(id); if (a !== null) run.ans[id] = a; });
}
function startRun(kind, title, ids, extra) {
  const run = Object.assign({ kind: kind, title: title, ids: ids, idx: 0, ans: {} }, extra || {});
  if (kind === "chapter") {
    fillRun(run);
    const first = ids.findIndex(function (id) { return run.ans[id] === undefined; });
    run.idx = first < 0 ? 0 : first;
  }
  S.run = run; S.view = "run"; S.confirm = null;
  render(); window.scrollTo(0, 0);
}
function stats(ids) {
  let done = 0, ok = 0;
  ids.forEach(function (id) { const a = getAns(id); if (a !== null) { done++; if (a === Q[id].a) ok++; } });
  return { done: done, ok: ok, ko: done - ok, total: ids.length };
}
function wrongIds(ids) { return ids.filter(function (id) { const a = getAns(id); return a !== null && a !== Q[id].a; }); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  '<circle class="sd" cx="300" cy="190" r="3.5"/><circle class="sd" cx="380" cy="190" r="3.5"/><circle class="sd" cx="460" cy="190" r="3.5"/>' +
  '<path class="sv" d="M40 100V112M28 112H52M34 124H46M28 136H52M34 148H46M40 148V160"/>' +
  '<rect class="sf" x="150" y="58" width="60" height="24"/><rect class="sf" x="520" y="58" width="60" height="24"/>' +
  '<rect class="sf" x="290" y="100" width="20" height="60"/><rect class="sf" x="370" y="100" width="20" height="60"/><rect class="sf" x="450" y="100" width="20" height="60"/>' +
  '<circle class="sf" cx="100" cy="70" r="14"/><text class="st1" x="100" y="75" text-anchor="middle">A</text>' +
  '<text class="st1" x="62" y="134">28 V</text>' +
  '<text class="st1" x="180" y="104" text-anchor="middle">R1</text><text class="st2" x="180" y="120" text-anchor="middle">4.6 Ω</text>' +
  '<text class="st1" x="550" y="104" text-anchor="middle">R5</text><text class="st2" x="550" y="120" text-anchor="middle">7 Ω</text>' +
  '<text class="st1" x="318" y="126">R2</text><text class="st2" x="318" y="142">12 Ω</text>' +
  '<text class="st1" x="398" y="126">R3</text><text class="st2" x="398" y="142">12 Ω</text>' +
  '<text class="st1" x="478" y="126">R4</text><text class="st2" x="478" y="142">4 Ω</text>' +
  '<path class="sv d" d="M150 58V28H167M210 58V28H193"/><circle class="sf" cx="180" cy="28" r="13"/><text class="st1" x="180" y="33" text-anchor="middle">V1</text>' +
  '<path class="sv d" d="M300 58V28H367M460 58V28H393"/><circle class="sf" cx="380" cy="28" r="13"/><text class="st1" x="380" y="33" text-anchor="middle">V2</text>' +
  '<path class="sv d" d="M520 58V28H537M580 58V28H563"/><circle class="sf" cx="550" cy="28" r="13"/><text class="st1" x="550" y="33" text-anchor="middle">V3</text>' +
  '</svg>';
function bookPage(q) {
  if (q.f === "annexA") return 24;
  if (q.ch.id === "1") return 21;
  if (q.ch.id === "17") return q.n <= 5 ? 270 : (q.n <= 12 ? 271 : 272);
  return null;
}
function figureHtml(q) {
  if (q.f === "annexA") {
    return '<figure class="fig"><div>' + FIG_A + '</div><figcaption>Annex A of the book, page 24 (printed page number). Redrawn here. The resistor values are deduced from the answer key of the book and agree with every answer to questions 13 to 26.</figcaption></figure>';
  }
  if (q.f === "missing") {
    return '<p class="note"><b>Figure in the book, page ' + bookPage(q) + '</b> (printed page number, chapter ' + esc(q.ch.id) + '). It is not in the text provided, so look at it in the book, then answer.</p>';
  }
  return "";
}

/* ---------- Views ---------- */
const root = document.getElementById("app");
function render() {
  if (S.view === "home") root.innerHTML = homeHtml();
  else if (S.view === "run") root.innerHTML = runHtml();
  else root.innerHTML = resultsHtml();
  paintSync();
}
function ticksHtml(ids) {
  return '<div class="ticks" aria-hidden="true">' + ids.map(function (id) {
    const a = getAns(id); return '<span class="t' + (a === null ? "" : a === Q[id].a ? " ok" : " ko") + '"></span>';
  }).join("") + "</div>";
}
function homeHtml() {
  const g = stats(ALL_IDS);
  const pct = g.done ? Math.round(100 * g.ok / g.done) : 0;
  const scopeIds = S.scope === "all" ? ALL_IDS : ALL_IDS.filter(function (id) { return Q[id].ch.grp === S.scope; });
  const wrong = wrongIds(ALL_IDS);
  let h = '<div class="top"><div><p class="eyebrow">CAE Oxford · 020 Aircraft General Knowledge 2</p><h1>ATPL Electrics</h1></div>' +
    '<div class="readouts"><div class="ro"><b>' + g.done + "/" + g.total + '</b><span>Answered</span></div>' +
    '<div class="ro g"><b>' + g.ok + '</b><span>Correct</span></div><div class="ro r"><b>' + g.ko + '</b><span>Wrong</span></div>' +
    '<div class="ro"><b>' + (g.done ? pct + " %" : "–") + '</b><span>Score</span></div></div></div>';
  h += '<div class="actions"><button class="btn primary" data-act="mix">Random 20 questions</button>' +
    '<div class="mixlabel"><span>Drawn from</span><div class="seg" role="group" aria-label="Scope of the random set">' +
    [["all", "All"], ["DC", "DC"], ["AC", "AC"]].map(function (x) { return '<button data-act="scope" data-v="' + x[0] + '" aria-pressed="' + (S.scope === x[0]) + '">' + x[1] + "</button>"; }).join("") +
    '</div></div><button class="btn" data-act="errors"' + (wrong.length ? "" : " disabled") + '>Retry my mistakes (' + wrong.length + ")</button></div>";
  ["DC", "AC"].forEach(function (grp) {
    const chs = DATA.filter(function (c) { return c.grp === grp; });
    const n = chs.reduce(function (a, c) { return a + c.ids.length; }, 0);
    h += '<section class="group"><h2>' + GROUPS[grp] + "<small>" + n + " questions</small></h2><div class=\"grid\">";
    chs.forEach(function (ch) {
      const s = stats(ch.ids);
      const secs = ch.sections.length > 1 ? ch.sections.map(function (x) { return x.name; }).join(" · ") : "";
      h += '<button class="chap" data-act="chapter" data-id="' + ch.id + '"><div class="row"><span class="no">CHAPTER ' + ch.id + '</span><span class="n">' + s.done + " / " + s.total + "</span></div>" +
        "<h3>" + esc(ch.title) + "</h3>" + (secs ? '<p class="sub">' + esc(secs) + "</p>" : "") + ticksHtml(ch.ids) + "</button>";
    });
    h += "</div></section>";
  });
  h += '<div class="foot"><span>Questions and answers come from the book. Chapters 2, 16 and 18 have no questions. Chapter 10 collects revision questions.</span><span id="syncnote"></span></div>';
  return h;
}
function runHtml() {
  const r = S.run, ids = r.ids, q = Q[ids[r.idx]];
  const st = { ok: 0, ko: 0 };
  ids.forEach(function (id) { const a = r.ans[id]; if (a !== undefined) { if (a === Q[id].a) st.ok++; else st.ko++; } });
  const answered = r.ans[q.id] !== undefined, chosen = r.ans[q.id];
  const allDone = st.ok + st.ko === ids.length;
  let h = '<div class="runbar"><div class="l"><button class="btn small" data-act="home">← Chapters</button><h1>' + esc(r.title) + '</h1></div>' +
    '<div class="tally" aria-label="Score"><span class="g">✓ ' + st.ok + '</span><span class="r">✕ ' + st.ko + '</span><span>' + (st.ok + st.ko) + "/" + ids.length + "</span></div></div>";
  h += '<div class="layout"><section class="card ' + (answered ? "done" : "open") + '" id="card"><div class="meta"><span class="pos">QUESTION ' + (r.idx + 1) + " / " + ids.length + "</span>" +
    '<span class="ref">Chapter ' + esc(q.ch.id) + " · " + (q.ch.sections.length > 1 ? esc(q.sec) + " · " : "") + "Q" + q.n + (q.f ? " · figure p. " + bookPage(q) : "") + "</span></div>";
  h += figureHtml(q);
  h += '<p class="qtext" id="qtext">' + esc(q.q) + "</p>";
  h += '<div class="opts" role="group" aria-labelledby="qtext">';
  q.o.forEach(function (txt, i) {
    let cls = "opt", lab = "";
    if (answered) {
      if (i === q.a) { cls += " right"; lab = chosen === i ? "Correct" : "Right answer"; }
      else if (i === chosen) { cls += " wrong"; lab = "Your answer"; }
      else cls += " dim";
    }
    h += '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (answered ? ' aria-disabled="true"' : "") + '><span class="k">' + LET[i] + '</span><span class="tx">' + esc(txt) + '</span><span class="st">' + lab + "</span></button>";
  });
  h += "</div>";
  h += '<p class="fb ' + (answered ? (chosen === q.a ? "ok" : "ko") : "") + '" aria-live="polite">' +
    (answered ? (chosen === q.a ? "✓ Correct." : "✕ Wrong. The right answer is " + LET[q.a] + ".") : "") + "</p>";
  if (answered && q.e) {
    if (chosen !== q.a) h += '<div class="why ko"><b>Explanation</b>' + esc(q.e) + "</div>";
    else h += '<details class="why"><summary>Why is this right?</summary><p>' + esc(q.e) + "</p></details>";
  }
  const last = r.idx === ids.length - 1;
  h += '<div class="nav2"><button class="btn" data-act="prev"' + (r.idx === 0 ? " disabled" : "") + '>← Previous</button>';
  if (last) h += '<button class="btn primary" data-act="finish"' + (allDone ? "" : " disabled") + '>See results</button>';
  else h += '<button class="btn primary" data-act="next">' + (answered ? "Next →" : "Skip →") + "</button>";
  h += "</div></section>";
  // tracker
  h += '<aside class="tracker" aria-label="Question navigator"><h3>Questions</h3>';
  const chips = function (list) {
    return '<div class="chips">' + list.map(function (id) {
      const i = ids.indexOf(id), a = r.ans[id];
      return '<button class="chip' + (a === undefined ? "" : a === Q[id].a ? " ok" : " ko") + (i === r.idx ? " cur" : "") + '" data-act="go" data-i="' + i + '" aria-label="Question ' + (i + 1) + (a === undefined ? "" : a === Q[id].a ? ", correct" : ", wrong") + '"' + (i === r.idx ? ' aria-current="true"' : "") + ">" + (i + 1) + "</button>";
    }).join("") + "</div>";
  };
  if (r.kind === "chapter" && Q[ids[0]].ch.sections.length > 1) {
    const ch = Q[ids[0]].ch;
    ch.sections.forEach(function (s, si) {
      h += "<h4>" + esc(s.name) + "</h4>" + chips(ids.filter(function (id) { return Q[id].si === si; }));
    });
  } else h += chips(ids);
  h += '<div class="legend"><span><i class="ok"></i>Correct</span><span><i class="ko"></i>Wrong</span><span><i></i>Unanswered</span></div>';
  if (r.kind === "chapter") {
    h += '<div class="reset">';
    if (S.confirm === "reset") h += '<span>Erase your answers for this chapter?</span><button class="btn small danger" data-act="reset-yes">Yes, erase</button><button class="btn small" data-act="reset-no">Cancel</button>';
    else h += '<button class="btn small" data-act="reset">Reset chapter</button>';
    h += "</div>";
  }
  h += "</aside></div>";
  return h;
}
function resultsHtml() {
  const r = S.run, ids = r.ids;
  let ok = 0; const bad = [];
  ids.forEach(function (id) { if (r.ans[id] === Q[id].a) ok++; else if (r.ans[id] !== undefined) bad.push(id); });
  const pct = Math.round(100 * ok / ids.length);
  let h = '<div class="runbar"><div class="l"><button class="btn small" data-act="home">← Chapters</button><h1>' + esc(r.title) + "</h1></div></div>";
  h += '<div class="res"><div class="score"><b>' + pct + ' %</b><span>' + ok + " correct out of " + ids.length + "</span></div>";
  h += '<div class="actions" style="margin:0"><button class="btn primary" data-act="retry-bad"' + (bad.length ? "" : " disabled") + ">Retry my " + bad.length + " mistakes</button>" +
    '<button class="btn" data-act="review">Review questions</button>' +
    (r.kind === "chapter" ? (S.confirm === "reset" ? '<button class="btn danger" data-act="reset-yes">Confirm reset</button><button class="btn" data-act="reset-no">Cancel</button>' : '<button class="btn" data-act="reset">Restart chapter</button>') :
      '<button class="btn" data-act="mix">New random set</button>') + "</div>";
  if (bad.length) {
    h += "<div><h2 style=\"font:700 26px/1 var(--font-display);text-transform:uppercase;margin-bottom:14px\">Missed questions</h2><ul class=\"wlist\">";
    bad.forEach(function (id) {
      const q = Q[id];
      h += '<li><span class="ref">Ch. ' + esc(q.ch.id) + " · Q" + q.n + '</span><span class="q">' + esc(q.q) + '</span><span class="a">✓ ' + LET[q.a] + ". " + esc(q.o[q.a]) + "</span>" + (q.e ? '<span class="e">' + esc(q.e) + "</span>" : "") + "</li>";
    });
    h += "</ul></div>";
  }
  return h + "</div>";
}

/* ---------- Actions ---------- */
function pick(i) {
  const r = S.run, id = r.ids[r.idx];
  if (r.ans[id] !== undefined) return;
  r.ans[id] = i;
  P[id] = [i, Date.now()];
  persist();
  render();
}
function go(i) { S.run.idx = Math.max(0, Math.min(S.run.ids.length - 1, i)); render(); const c = document.getElementById("card"); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView(); }
function resetChapter() {
  const r = S.run, t = Date.now();
  r.ids.forEach(function (id) { if (P[id]) P[id] = [-1, t]; });
  persist(); fillRun(r); r.idx = 0; S.confirm = null; S.view = "run"; render(); window.scrollTo(0, 0);
}
root.addEventListener("click", function (e) {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "pick") pick(+b.dataset.i);
  else if (a === "next") go(S.run.idx + 1);
  else if (a === "prev") go(S.run.idx - 1);
  else if (a === "go") go(+b.dataset.i);
  else if (a === "finish") { S.view = "results"; S.confirm = null; render(); window.scrollTo(0, 0); }
  else if (a === "review") { S.view = "run"; S.run.idx = 0; render(); window.scrollTo(0, 0); }
  else if (a === "home") { S.view = "home"; S.run = null; S.confirm = null; render(); window.scrollTo(0, 0); }
  else if (a === "chapter") { const ch = chapterById(b.dataset.id); startRun("chapter", "Chapter " + ch.id + " · " + ch.title, ch.ids.slice()); }
  else if (a === "scope") { S.scope = b.dataset.v; render(); }
  else if (a === "mix") {
    const pool = S.run && S.view !== "home" ? ALL_IDS : (S.scope === "all" ? ALL_IDS : ALL_IDS.filter(function (id) { return Q[id].ch.grp === S.scope; }));
    startRun("mix", "Random · 20 questions", shuffle(pool).slice(0, 20));
  }
  else if (a === "errors") startRun("errors", "My mistakes", wrongIds(ALL_IDS));
  else if (a === "retry-bad") { const ids = S.run.ids.filter(function (id) { return S.run.ans[id] !== undefined && S.run.ans[id] !== Q[id].a; }); startRun("errors", "My mistakes", ids); }
  else if (a === "reset") { S.confirm = "reset"; render(); }
  else if (a === "reset-no") { S.confirm = null; render(); }
  else if (a === "reset-yes") resetChapter();
});
document.addEventListener("keydown", function (e) {
  if (S.view !== "run" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if (idx >= 0 && idx < Q[S.run.ids[S.run.idx]].o.length) { pick(idx); e.preventDefault(); }
  else if (e.key === "ArrowRight" || (e.key === "Enter" && document.activeElement === document.body)) { if (S.run.idx < S.run.ids.length - 1) { go(S.run.idx + 1); e.preventDefault(); } }
  else if (e.key === "ArrowLeft") { if (S.run.idx > 0) { go(S.run.idx - 1); e.preventDefault(); } }
});

render();
initSync();
</script>

</body></html>
