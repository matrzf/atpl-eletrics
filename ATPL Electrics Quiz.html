<title>ATPL Electrics Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: chapter board (home) -> single-question practice card with a numbered answer tracker beside it. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --surface-2: #e3e8ed;
  --ink: #131f2a;
  --muted: #566573;
  --line: #c8d1d9;
  --accent: #9a4f00;
  --accent-soft: #f6e4cd;
  --primary: #17364f;
  --on-primary: #ffffff;
  --good: #14733c;
  --good-soft: #e0f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e2;
  --tick: #c3ccd5;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1218; --surface: #121c25; --surface-2: #1a2732; --ink: #e5edf3; --muted: #92a3b1;
    --line: #26363f; --accent: #ffb84d; --accent-soft: #3a2b12; --primary: #8fc4ee; --on-primary: #0b1218;
    --good: #4ad087; --good-soft: #12301f; --bad: #ff7b71; --bad-soft: #3a1816; --tick: #2b3b47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1218; --surface: #121c25; --surface-2: #1a2732; --ink: #e5edf3; --muted: #92a3b1;
  --line: #26363f; --accent: #ffb84d; --accent-soft: #3a2b12; --primary: #8fc4ee; --on-primary: #0b1218;
  --good: #4ad087; --good-soft: #12301f; --bad: #ff7b71; --bad-soft: #3a1816; --tick: #2b3b47;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--font-body);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: flex-end; justify-content: space-between; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.top h1 { font: 700 clamp(34px, 7vw, 56px)/.95 var(--font-display); text-transform: uppercase; letter-spacing: .01em; }
.readouts { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.ro { display: grid; gap: 2px; min-width: 0; }
.ro b { font: 500 26px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.ro span { font: 600 12px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ro.g b { color: var(--good); } .ro.r b { color: var(--bad); }

/* ---------- Home ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin: 24px 0 8px; }
.btn { border: 1.5px solid var(--ink); background: transparent; padding: 10px 16px; border-radius: 4px; font-weight: 600; min-height: 44px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { filter: brightness(1.12); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-weight: 500; font-size: 14px; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mixlabel { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; color: var(--muted); font-size: 14px; }
.group { margin-top: 36px; }
.group h2 { display: flex; align-items: baseline; gap: 14px; font: 700 28px/1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.group h2 small { font: 500 13px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-top: 16px; }
.chap { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.chap:hover { border-color: var(--ink); }
.chap .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.chap .no { font: 500 13px/1 var(--font-mono); color: var(--accent); letter-spacing: .06em; }
.chap .n { font: 500 13px/1 var(--font-mono); color: var(--muted); }
.chap h3 { font: 600 22px/1.15 var(--font-display); letter-spacing: .01em; }
.chap .sub { font-size: 14px; color: var(--muted); margin: 0; }
.ticks { display: flex; flex-wrap: wrap; gap: 3px; }
.t { width: 7px; height: 14px; border-radius: 1px; background: var(--tick); flex: none; }
.t.ok { background: var(--good); } .t.ko { background: var(--bad); }
.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: grid; gap: 6px; }

/* ---------- Run ---------- */
.runbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.runbar .l { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; min-width: 0; }
.runbar h1 { font: 700 clamp(24px, 4.5vw, 34px)/1 var(--font-display); text-transform: uppercase; }
.tally { display: flex; gap: 18px; font: 500 16px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.tally .g { color: var(--good); } .tally .r { color: var(--bad); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; margin-top: 24px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: clamp(16px, 3vw, 28px); min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.meta .pos { font: 500 14px/1 var(--font-mono); color: var(--accent); letter-spacing: .04em; }
.meta .ref { font: 400 13px/1.3 var(--font-mono); color: var(--muted); }
.qtext { font: 500 clamp(19px, 2.6vw, 23px)/1.4 var(--font-body); max-width: 62ch; margin-bottom: 22px; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); min-height: 56px; }
.opt .k { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--muted); font: 500 15px/1 var(--font-mono); color: var(--muted); }
.opt .tx { overflow-wrap: anywhere; font-size: 17px; line-height: 1.4; }
.opt .st { font: 600 12px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.open .opt:hover { border-color: var(--ink); background: var(--surface-2); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); border-color: var(--good); color: var(--bg); }
.opt.right .st { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt.wrong .st { color: var(--bad); }
.opt.dim { opacity: .62; }
.fb { margin: 18px 0 0; min-height: 28px; font-weight: 600; }
.fb.ok { color: var(--good); } .fb.ko { color: var(--bad); }
.why { margin: 16px 0 0; padding: 14px 16px; border-left: 4px solid var(--muted); background: var(--surface-2); border-radius: 0 6px 6px 0; max-width: 62ch; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.why.ko { border-left-color: var(--bad); background: var(--bad-soft); }
.why b { display: block; font: 600 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
.why.ko b { color: var(--bad); }
details.why summary { cursor: pointer; font-weight: 600; }
details.why p { margin: 10px 0 0; }
.wlist .e { grid-column: 2; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.nav2 { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 20px; }
.note { margin: 0 0 20px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 14px; max-width: 62ch; }
.fig { margin: 0 0 22px; border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; }
.fig svg { display: block; width: 100%; min-width: 460px; height: auto; max-width: 720px; margin: 0 auto; }
.fig figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
.sv { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sv.d { stroke-dasharray: 4 4; stroke: var(--muted); stroke-width: 1.5; }
.sf { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.sd { fill: var(--ink); stroke: none; }
.st1 { font: 500 13px var(--font-mono); fill: var(--ink); }
.st2 { font: 400 12px var(--font-mono); fill: var(--muted); }

.tracker { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; position: sticky; top: 16px; min-width: 0; }
.tracker h3 { font: 600 14px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.tracker h4 { font: 400 12px/1.2 var(--font-mono); color: var(--muted); margin: 14px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { width: 38px; height: 38px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); font: 500 13px/1 var(--font-mono); padding: 0; }
.chip:hover { border-color: var(--ink); }
.chip.ok { background: var(--good); border-color: var(--good); color: var(--bg); }
.chip.ko { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.chip.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--tick); }
.legend i.ok { background: var(--good); } .legend i.ko { background: var(--bad); }
.reset { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }

/* ---------- Results ---------- */
.res { margin-top: 24px; display: grid; gap: 24px; }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; }
.score b { font: 700 clamp(64px, 16vw, 112px)/.9 var(--font-display); }
.score span { font: 500 18px/1.3 var(--font-mono); color: var(--muted); }
.wlist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.wlist li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.wlist .ref { font: 400 13px/1.4 var(--font-mono); color: var(--muted); }
.wlist .q { overflow-wrap: anywhere; }
.wlist .a { grid-column: 2; color: var(--good); font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tracker { position: static; }
  .opt { grid-template-columns: 32px minmax(0, 1fr); }
  .opt .st { grid-column: 2; }
  .opt .st:empty { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .chap, .chip, .btn { transition: background-color .12s, border-color .12s; }
}
</style>

<script>
const DATA = [{"id":"1","title":"Basic Principles","grp":"DC","sections":[{"name":"Theory","qs":[{"n":1,"q":"All effects of electricity take place because of the existence of a tiny particle called the:","o":["electric","proton","neutron","electron"],"a":3,"e":"Every electrical effect comes from the electron, the tiny negatively charged particle that moves through conductors."},{"n":2,"q":"The nucleus of an atom is:","o":["positively charged","negatively charged","statically charged","of zero potential"],"a":0,"e":"The nucleus holds protons (positive) and neutrons (no charge), so its net charge is positive."},{"n":3,"q":"An atom is electrically balanced when:","o":["its protons and electrons balance each other","the protons outnumber the electrons","the electrons outnumber the protons","the electric and static charges are balanced"],"a":0,"e":"An atom is neutral when its number of protons (+) equals its number of electrons (−): the charges cancel."},{"n":4,"q":"The electrons of an atom are:","o":["positively charged","neutral","negatively charged","of zero potential"],"a":2,"e":"Electrons carry a negative charge. Protons are positive, neutrons have no charge."},{"n":5,"q":"A material with a deficiency of electrons becomes:","o":["positively charged","negatively charged","isolated","overheated"],"a":0,"e":"If electrons are missing, the positive protons outnumber them, so the material is positively charged."},{"n":6,"q":"A material with a surplus of electrons becomes:","o":["positively charged","negatively charged","over charged","saturated"],"a":1,"e":"A surplus of electrons (negative charges) makes the material negatively charged."},{"n":7,"q":"Heat produces an electric charge when:","o":["like poles are joined","a hard and soft glass is heated","the junction of two unlike metals is heated","hard and soft material are rubbed together"],"a":2,"e":"Heating the junction of two dissimilar metals produces an EMF. This is the thermocouple effect."},{"n":8,"q":"Friction causes:","o":["mobile electricity","basic electricity","static electricity","wild electricity"],"a":2,"e":"Rubbing two materials together (friction) separates charges and produces static electricity."},{"n":9,"q":"Chemical action produces electricity in:","o":["a light meter","a generator","a primary cell","starter generator"],"a":2,"e":"A primary cell turns chemical energy into electricity. A generator uses magnetism and a light meter uses light."},{"n":10,"q":"A photo electric cell produces electricity when:","o":["two metals are heated","exposed to a light source","a light source is removed","exposed to the heat of the sun"],"a":1,"e":"A photoelectric cell turns light energy directly into electrical energy."}]},{"name":"Units 1","qs":[{"n":1,"q":"The difference in electric potential is measured in:","o":["kVARs","watts","amps","volts"],"a":3,"e":"Potential difference (voltage) is measured in volts. Amps measure current, watts measure power."},{"n":2,"q":"Electrical power is measured in:","o":["watts","amperes","ohms","volts"],"a":0,"e":"Electrical power is measured in watts (W). Amperes measure current, ohms resistance, volts potential."},{"n":3,"q":"The unit measurement of electrical resistance is:","o":["the volt","the watt","the ohm","the ampere"],"a":2,"e":"Resistance is measured in ohms (Ω)."},{"n":4,"q":"An ammeter measures:","o":["current","power dissipation","differences of electrical potential","heat energy"],"a":0,"e":"An ammeter measures current (in amperes). It is connected in series with the circuit."},{"n":5,"q":"Materials containing ‘free electrons’ are called:","o":["insulators","resistors","collectors","conductors"],"a":3,"e":"Materials with free electrons let current flow easily: they are conductors. Insulators have none."},{"n":6,"q":"The unit used for measuring the EMF of electricity is:","o":["the ohm","the ampere","the volt","the watt"],"a":2,"e":"EMF (electromotive force) is measured in volts."},{"n":7,"q":"The unit used for measuring:","o":["current - is the volt","resistance - is the ohm","electric power - is the capacitor","EMF - is the amp"],"a":1,"e":"Resistance is measured in ohms. Current is in amps, EMF in volts, power in watts. A capacitor is a component, not a unit."},{"n":8,"q":"Three resistors of 60 ohms each in parallel give a total resistance of:","o":["180 ohms","40 ohms","30 ohms","20 ohms"],"a":3,"e":"Equal resistors in parallel: total = R / n = 60 / 3 = 20 Ω."},{"n":9,"q":"A voltmeter measures:","o":["electromotive force","the heat loss in a series circuit","the current flow in a circuit","the resistance provided by the trimming devices"],"a":0,"e":"A voltmeter, connected across a component, measures the EMF or potential difference between two points."},{"n":10,"q":"Watts =","o":["resistance squared × amps","volts × ohms","ohms × amps","volts × amps"],"a":3,"e":"Power (W) = volts × amps (P = V × I)."}]},{"name":"Units 2","qs":[{"n":1,"q":"The total resistance of a number of power consumer devices connected in series is:","o":["the addition of the individual resistances","the addition of the reciprocals of the individual resistance","twice the reciprocal of the individual resistances","the reciprocal of the total"],"a":0,"e":"In series the total resistance is simply the sum of the individual resistances."},{"n":2,"q":"The total resistance of a number of resistances connected in parallel is:","o":["R = R1 + R2 + R3 + R4","1/RT = 1/R1 + 1/R2 + 1/R3 + 1/R4","1/RT = R1 + R2 + R3 + R4","RT = 1/R1 + 1/R2 + 1/R3 + 1/R4"],"a":1,"e":"In parallel: 1/RT = 1/R1 + 1/R2 + 1/R3 + 1/R4. You add the reciprocals, then invert the result."},{"n":3,"q":"Ohm’s Law states:","o":["Current in amps = Resistance in ohms / Electromotive force in volts","Resistance in ohms = Current in amps / Electromotive force in volts","Current in amps = Electromotive force in volts / Resistance in ohms"],"a":2,"e":"Ohm's law: current (A) = voltage (V) / resistance (Ω), so I = V / R."},{"n":4,"q":"A device consuming 80 watts at 8 amps would have a voltage supply of:","o":["640 volts","12 volts","10 volts","8 volts"],"a":2,"e":"P = V × I, so V = P / I = 80 / 8 = 10 volts."},{"n":5,"q":"In a simple electrical circuit, if the resistors are in parallel, the total current consumed is equal to:","o":["the sum of the currents taken by the resistors divided by the number of resistors","the sum of the currents taken by the resistors","the average current taken by the resistors times the number of the resistors","the sum of the reciprocals of the currents taken by the resistors"],"a":1,"e":"In parallel the branch currents add up to the total current (the sum of the currents)."},{"n":6,"q":"The symbol for volts is:","o":["E or W","V or E","I or V","R or W"],"a":1,"e":"The symbol for volts is V (the quantity itself is often written E for EMF). W is watts and I is current."},{"n":7,"q":"Electrical potential is measured in:","o":["watts","bars","volts","ohms"],"a":2,"e":"Electrical potential is measured in volts."},{"n":8,"q":"If a number of electrical consuming devices were connected in parallel, the reciprocal of the total resistance would be:","o":["the sum of the currents","the sum of the reciprocals of the individual resistances","the sum of their resistances","volts divided by the sum of the resistances"],"a":1,"e":"In parallel, the reciprocal of the total resistance is the sum of the reciprocals of the individual resistances."},{"n":9,"q":"The current flowing in an electrical circuit is measured in:","o":["volts","ohms","inductance","amps"],"a":3,"e":"Current is measured in amperes (amps)."},{"n":10,"q":"Electromotive force is measured in:","o":["amps × volts","watts","ohms","volts"],"a":3,"e":"Electromotive force is measured in volts."}]},{"name":"General","qs":[{"n":1,"q":"Ohm’s Law is given by the formula:","o":["I = R / V","V = R / I","I = V / R","R = V × I"],"a":2,"e":"Ohm's law: I = V / R (current = voltage divided by resistance)."},{"n":2,"q":"The current flowing in a circuit is:","o":["directly proportional to resistance, indirectly proportional to voltage","directly proportional to temperature, inversely proportional to resistance","inversely proportional to resistance, directly proportional to voltage","inversely proportional to applied voltage, directly proportional to temperature"],"a":2,"e":"Current rises with voltage (directly proportional) and falls as resistance rises (inversely proportional): I = V / R."},{"n":3,"q":"The unit of EMF is the:","o":["ampere","vol","watt","ohm"],"a":1,"e":"The unit of EMF is the volt. The option is misspelled \"vol\" in the book."},{"n":4,"q":"Potential difference is measured in:","o":["amps","volts","watts","ohms"],"a":1,"e":"Potential difference is measured in volts."},{"n":5,"q":"The unit of current is the:","o":["ampere","volt","watt","ohm"],"a":0,"e":"The unit of current is the ampere."},{"n":6,"q":"The unit of resistance is the:","o":["ampere","volt","watt","ohm"],"a":3,"e":"The unit of resistance is the ohm."},{"n":7,"q":"Electrical power is measured in:","o":["amperes","volts","watts","ohms"],"a":2,"e":"Electrical power is measured in watts."},{"n":8,"q":"1250 ohms may also be expressed as:","o":["1250 k ohms","1.25 k ohms","1.25 M ohms","0.125 k ohms"],"a":1,"e":"1250 Ω ÷ 1000 = 1.25 kΩ (k = ×1000)."},{"n":9,"q":"1.5 M ohms may also be expressed as:","o":["15000 ohms","1500 ohms","150000 ohms","1500 k ohms"],"a":3,"e":"1.5 MΩ = 1 500 000 Ω = 1500 kΩ (M = ×1 000 000, k = ×1000)."},{"n":10,"q":"550 k ohms may also be expressed as:","o":["550000 M ohms","0.55 M ohms","55000 ohms","0.55 ohms"],"a":1,"e":"550 kΩ = 550 000 Ω = 0.55 MΩ."},{"n":11,"q":"If the voltage applied to a simple resistor increases:","o":["current will decrease but power consumed remains constant","resistance and power decrease","current flow will increase and power consumed will increase","current flow increases and power consumed decreases"],"a":2,"e":"More voltage across the same resistor means more current (I = V/R) and more power (P = V²/R)."},{"n":12,"q":"What is the total resistance in this circuit:","o":["11.5 ohms","11500 k ohms","11.5 k ohms","11.5 M ohms"],"a":2,"f":"missing","e":"This question uses a circuit drawing from the book, which is not available here. The book's answer is 11.5 kΩ, the same as 11 500 Ω."},{"n":13,"q":"The total resistance of the circuit is:","o":["14 ohms","39.6 ohms","25.6 ohms","varies with the applied voltage"],"a":0,"f":"annexA","e":"R1 + (R2, R3, R4 in parallel) + R5 = 4.6 + 2.4 + 7 = 14 Ω. Check: 28 V / 2 A = 14 Ω."},{"n":14,"q":"The current flow indication on ammeter ‘A’ would be:","o":["2 amps","2 volts","2.5 amps","2.5 volts"],"a":0,"f":"annexA","e":"I = V / R = 28 / 14 = 2 A. An ammeter reads amps, not volts."},{"n":15,"q":"The total power consumed in the circuit will be:","o":["14 kilowatts","56 kilowatts","56 watts","14 watts"],"a":2,"f":"annexA","e":"P = V × I = 28 × 2 = 56 W (watts, not kilowatts)."},{"n":16,"q":"The power consumed by R5 alone is:","o":["14 watts","28 watts","112 watts","28 kilowatts"],"a":1,"f":"annexA","e":"R5 = 7 Ω carries 2 A: P = I² × R = 4 × 7 = 28 W."},{"n":17,"q":"The indication on voltmeter V1 will be:","o":["2.3 volts","28 volts","9.2 volts","92 volts"],"a":2,"f":"annexA","e":"V1 is across R1 (4.6 Ω): 2 A × 4.6 Ω = 9.2 V."},{"n":18,"q":"The indication on voltmeter V3 will be:","o":["28 volts","14 volts","14 amps","3.5 volts"],"a":1,"f":"annexA","e":"V3 is across R5 (7 Ω): 2 A × 7 Ω = 14 V."},{"n":19,"q":"The indication on voltmeter V2 will be:","o":["28 volts","4.8 volts","9.6 volts","14 volts"],"a":1,"f":"annexA","e":"V2 is across the parallel group (2.4 Ω): 2 A × 2.4 Ω = 4.8 V. Check: 28 − 9.2 − 14 = 4.8 V."},{"n":20,"q":"The current flowing through R2 is:","o":["0.04 amps","0.4 amps","4 amps","40 milliamps"],"a":1,"f":"annexA","e":"R2 (12 Ω) sees 4.8 V: I = 4.8 / 12 = 0.4 A."},{"n":21,"q":"The current flowing through R3 is:","o":["0.04 amps","0.4 amps","4 amps","40 milliamps"],"a":1,"f":"annexA","e":"R3 (12 Ω) sees 4.8 V: I = 4.8 / 12 = 0.4 A."},{"n":22,"q":"The current flowing through R4 is:","o":["120 milliamps","1.2 amps","19.2 amps","1.92 milliamps"],"a":1,"f":"annexA","e":"R4 (4 Ω) sees 4.8 V: I = 4.8 / 4 = 1.2 A. Check: 0.4 + 0.4 + 1.2 = 2 A total."},{"n":23,"q":"The power consumed by R2 alone is:","o":["1.92 kilowatts","1.92 watts","65.3 watts","65.3 kilowatts"],"a":1,"f":"annexA","e":"P = V × I = 4.8 × 0.4 = 1.92 W."},{"n":24,"q":"The power consumed by R3 alone is:","o":["1.92 kilowatts","1.92 watts","65.3 watts","65.3 kilowatts"],"a":1,"f":"annexA","e":"P = V × I = 4.8 × 0.4 = 1.92 W, the same as R2 since both are 12 Ω."},{"n":25,"q":"The power consumed by R4 alone is:","o":["5.76 kilowatts","5.76 volts","5.76 watts","3.33 watts"],"a":2,"f":"annexA","e":"P = V × I = 4.8 × 1.2 = 5.76 W."},{"n":26,"q":"The power consumed by R1 alone is:","o":["18.4 kilowatts","42.32 watts","18.4 watts","4.232 kilowatts"],"a":2,"f":"annexA","e":"P = V × I = 9.2 × 2 = 18.4 W."}]}]},{"id":"3","title":"Circuit Protection and Capacitors","grp":"DC","sections":[{"name":"Circuit Breakers","qs":[{"n":1,"q":"In a circuit fitted with a non-trip free circuit breaker if a fault occurs and persists:","o":["if the reset button is depressed and held in, the circuit will be made","the trip button may be pressed to reset, but not permanently","a non-trip free circuit breaker can never be bypassed","the reset button may be pressed to make the circuit permanent"],"a":0,"e":"A non-trip-free breaker can be held in by hand: with the reset held in, the circuit is made even though the fault persists. This is why it is dangerous."},{"n":2,"q":"A trip free circuit breaker that has tripped due to overload:","o":["can be reset and held in during rectification","can never be reset","can be reset after overhaul","may be reset manually after fault has been cleared"],"a":3,"e":"A trip-free breaker cannot be held in against a fault. It can only be reset by hand once the fault has been cleared."},{"n":3,"q":"Circuit breakers and fuses:","o":["are used in DC circuits only","are used in AC or DC circuits","are used in AC circuits only","are used in low current circuits only"],"a":1,"e":"Fuses and circuit breakers protect AC and DC circuits alike."},{"n":4,"q":"A trip free circuit breaker is one which:","o":["cannot be reset by holding the lever in while the fault persists","can be reset by holding the lever in while the fault persists","must be held in during checks to find faults","can be bypassed"],"a":0,"e":"On a trip-free breaker the tripping mechanism overrides the reset lever, so holding it in does not keep the fault connected."},{"n":5,"q":"If the reset button is pressed in the trip free circuit breaker, the contacts with the fault cleared will:","o":["be made and kept made","only be made if there is a fuse in the circuit","reset itself only after a delay of 20 seconds","not be made and the reset will remain inoperative"],"a":0,"e":"Once the fault is cleared, pressing the reset button closes the contacts and they stay closed."},{"n":6,"q":"A circuit breaker is a device for:","o":["controlling rotor movement only","isolating the service on overload","isolating the battery when using the ground batteries","earthing the magnetos when switching off"],"a":1,"e":"A circuit breaker isolates (opens) a circuit when an overload occurs."},{"n":7,"q":"A non-trip free circuit breaker is:","o":["one which can make a circuit in flight by pushing a button","a wire placed in a conductor which melts under overload","another type of voltage regulator","an on-off type tumbler switch"],"a":0,"e":"A non-trip-free breaker is one that can be pushed in again (reset), even in flight, to remake the circuit."},{"n":8,"q":"A non-trip free circuit breaker that has tripped due to overload:","o":["can never be reset","can only be reset on the ground by a maintenance engineer","can be reset and held in if necessary","cannot be reset while the fault is still there"],"a":3,"e":"The book's answer: a tripped breaker will not stay in while the fault is still present. Do not confuse this with question 1, where a non-trip-free breaker can be held in by hand."},{"n":9,"q":"A thermal circuit breaker works on the principle of:","o":["differential expansion of metals","differential thickness of metals","differential density of metals","differential pressure of metals"],"a":0,"e":"A thermal breaker uses a bimetallic strip: two metals expand by different amounts when heated and bend to open the contacts."},{"n":10,"q":"Circuit breakers are fitted in:","o":["series with the load","parallel with the load","across the load","shunt with the load"],"a":0,"e":"A circuit breaker is wired in series with the load, so that all the load current passes through it."}]},{"name":"Fuses","qs":[{"n":1,"q":"A fuse is said to have blown when:","o":["an excess current has burst the outer cover and disconnected the circuit from the supply","the circuit is reconnected","a current of a higher value than the fuse rating has melted the conductor and disconnected the circuit from the supply","the amperage has been sufficiently high to cause the fuse to trip out of its holder and has therefore, disconnected the circuit from the supply"],"a":2,"e":"A fuse is blown when a current above its rating has melted the fuse element and opened the circuit."},{"n":2,"q":"In a fused circuit the fuse is:","o":["in parallel with the load","in series with the load","in the conductor between generator and regulator","only fitted when loads are in series"],"a":1,"e":"A fuse is placed in series with the load so that all the load current flows through it."},{"n":3,"q":"Overloading an electrical circuit causes the fuse to ‘Blow’. This:","o":["increases the weight of the insulation","fractures the fuse case","disconnects the fuse from its holder","melts the fuse wire"],"a":3,"e":"Overload current overheats the fuse wire until it melts, which opens the circuit."},{"n":4,"q":"What must be checked before replacing a fuse?","o":["The ohms of the circuit","The amps being used in the circuit","The amps capacity of the consuming device in the circuit","The correct fuse volt or watts rating"],"a":2,"e":"Before replacing a fuse, check the current capacity of the equipment it protects so the new fuse has the correct rating."},{"n":5,"q":"The size of fuse required for an electrical circuit whose power is 72 watts and whose voltage is 24 volts is:","o":["24 amps","10 amps","5 amps","15 amps"],"a":2,"e":"I = P / V = 72 / 24 = 3 A. The next standard fuse above that is 5 A."},{"n":6,"q":"When selecting a fuse for an aircraft circuit the governing factor is:","o":["the voltage of the circuit","cable cross-sectional area","resistance of the circuit","power requirements of the circuit"],"a":3,"e":"The fuse rating is chosen from the power requirement of the circuit: I = P / V."},{"n":7,"q":"A fuse in an electrical circuit is ‘blown’ by:","o":["cooler air","the breaking of the glass tube","excess voltage breaking the fuse wire","excess current rupturing the fuse wire"],"a":3,"e":"It is excess current, not voltage, that heats and melts the fuse wire."},{"n":8,"q":"A fuse is used to protect an electrical circuit, it is:","o":["of low melting point","of high capacity","of high melting point","of low resistance"],"a":0,"e":"A fuse wire has a low melting point so that it melts before the cable or equipment is damaged."},{"n":9,"q":"Fuses:","o":["protect the load","protect the cable","protect the generator","protect both the circuit cable and load"],"a":3,"e":"A fuse protects the circuit cable and the load connected to it."},{"n":10,"q":"A current limiter:","o":["is a fuse with a low melting point","is a circuit breaker","is a fuse with a high melting point","is a fuse enclosed in a quartz or sand"],"a":2,"e":"A current limiter is a fuse with a high melting point, used for heavy currents in main circuits. It only blows on large faults."}]}]},{"id":"4","title":"Batteries","grp":"DC","sections":[{"name":"Batteries 1","qs":[{"n":1,"q":"Battery voltage is tested with:","o":["a megometer","a voltmeter on rated load","an ammeter with a rated voltage","a hygrometer"],"a":1,"e":"Test battery voltage with a voltmeter while the rated load is connected. An unloaded reading can look good even on a weak battery."},{"n":2,"q":"Two 12 V 40 Ah batteries connected in series will produce:","o":["12 V 80 Ah","12 V 20 Ah","24 V 80 Ah","24 V 40 Ah"],"a":3,"e":"In series, voltages add and capacity stays the same: 12 + 12 = 24 V, still 40 Ah."},{"n":3,"q":"Two 12 V 40 Ah batteries connected in parallel will produce:","o":["12 V 80 Ah","24 V 80 Ah","12 V 20 Ah","24 V 40 Ah"],"a":0,"e":"In parallel, voltage stays the same and capacities add: 12 V, 40 + 40 = 80 Ah."},{"n":4,"q":"A battery capacity test is carried out:","o":["6 monthly","2 monthly","3 monthly","every minor check"],"a":2,"e":"The book's figure for a capacity test is every 3 months."},{"n":5,"q":"An aircraft has three batteries each of 12 volts with 40 Ah capacity connected in series. The resultant unit has:","o":["a voltage of 36 and a capacity of 120 Ah","a capacity of 120 Ah and a voltage of 12","a capacity of 36 Ah and 120 watts","a voltage of 36 and a capacity of 40 Ah"],"a":3,"e":"In series: voltage = 3 × 12 = 36 V, capacity stays at 40 Ah."},{"n":6,"q":"An aircraft has a battery with a capacity of 40 Ah. Assuming that it will provide its normal capacity and is discharged at the 10 hour rate:","o":["it will pass 40 amps for 10 hrs","it will pass 10 amps for 4 hrs","it will pass 4 amps for 10 hrs","it will pass 40 amps for 1 hr"],"a":2,"e":"At the 10-hour rate a 40 Ah battery gives 40 / 10 = 4 A for 10 hours."},{"n":7,"q":"Battery capacity percentage efficiency must always be:","o":["10% above saturation level","above 70%","80% or more","above 90%"],"a":2,"e":"The book's figure: battery capacity efficiency must always be 80% or more."},{"n":8,"q":"The method of ascertaining the voltage of a standard aircraft lead acid battery is by checking:","o":["the voltage on open circuit","the current flow with a rated voltage charge","the voltage off load","the voltage with rated load switched ON"],"a":3,"e":"Battery voltage is checked with the rated load switched on, not off load."},{"n":9,"q":"A battery is checked for serviceability by:","o":["using an ammeter","measuring the specific gravity of the electrolyte","a boric acid solution","using an ohmmeter"],"a":1,"e":"A lead-acid battery's state of charge is checked by measuring the specific gravity of the electrolyte."},{"n":10,"q":"In an AC circuit:","o":["the battery is connected in series","a battery cannot be used because the wire is too thick","a battery cannot be used because it is DC","only NiCad batteries can be used"],"a":2,"e":"Batteries supply direct current (DC), so they cannot be used in an AC circuit."}]},{"name":"Batteries 2","qs":[{"n":1,"q":"The specific gravity of a fully charged lead acid cell is:","o":["1.270","1.090","1.120","0.1270"],"a":0,"e":"A fully charged lead-acid cell has a specific gravity of about 1.270."},{"n":2,"q":"The nominal voltage of the lead acid cell is:","o":["1.2 volts","1.5 volts","1.8 volts","2.0 volts"],"a":3,"e":"A lead-acid cell has a nominal voltage of 2.0 V."},{"n":3,"q":"A lead acid battery voltage should be checked:","o":["on open circuit","using a trimmer circuit","with an ammeter","on load"],"a":3,"e":"Battery voltage is checked on load, because an off-load reading does not show its real condition."},{"n":4,"q":"In an aircraft having a battery of 24 volts nominal off load and fully charged the voltmeter would read:","o":["22 volts","24 volts","26 volts","28 volts"],"a":2,"e":"A 24 V battery has 12 cells of about 2.17 V each when fully charged, so about 26 V off load."},{"n":5,"q":"The system used to maintain aircraft batteries in a high state of charge is the:","o":["constant current system","constant load system","constant resistance system","constant voltage system"],"a":3,"e":"Aircraft batteries are kept charged by a constant-voltage charging system."},{"n":6,"q":"If you connect two identical batteries in series it will:","o":["double the volts and halve the capacity","reduce the voltage by 50%","double the volts and leave the capacity the same","double the volts and double the amps flowing in a circuit with twice the resistance"],"a":2,"e":"In series, voltages add and capacity stays the same."},{"n":7,"q":"The nominal voltage of an alkaline cell is:","o":["2.2 volts","1.8 volts","1.2 volts","0.12 volts"],"a":2,"e":"An alkaline (NiCad) cell has a nominal voltage of 1.2 V."},{"n":8,"q":"The specific gravity of a fully charged alkaline cell is:","o":["0.120 - 0.130","1.160","1.240 - 1.30","1.800"],"a":2,"e":"The book's figure for a fully charged alkaline cell is a specific gravity of 1.24 to 1.30."},{"n":9,"q":"The electrolyte used in the lead acid cell is diluted:","o":["hydrochloric acid","sulphuric acid","boric acid","potassium hydroxide"],"a":1,"e":"The electrolyte in a lead-acid cell is diluted sulphuric acid."},{"n":10,"q":"The electrolyte used in an alkaline battery is diluted:","o":["saline solution","sulphuric acid","cadmium and distilled water","potassium hydroxide solution"],"a":3,"e":"The electrolyte in an alkaline battery is a potassium hydroxide solution."}]},{"name":"Batteries 3","qs":[{"n":1,"q":"The number of lead acid cells required to make up a twelve volt battery is:","o":["8","12","6","10"],"a":2,"e":"Each cell is 2 V, so a 12 V battery needs 12 / 2 = 6 cells."},{"n":2,"q":"A voltmeter across the terminals of a battery with all services off will indicate:","o":["electromotive force","resistance","a flat battery","residual voltage"],"a":0,"e":"With all services off, a voltmeter across the battery reads its EMF (electromotive force)."},{"n":3,"q":"The voltage of a secondary cell is:","o":["determined by the number of plates","determined by the area of the plates","determined by the diameter of the main terminals","determined by the active materials on the plates"],"a":3,"e":"A cell's voltage depends on the active materials on its plates. Plate area sets the capacity."},{"n":4,"q":"The level of the electrolyte must be maintained:","o":["just below the top plate","above the plates level with the filler cap","one inch below the top of the plates","just above the top of the plates"],"a":3,"e":"The electrolyte level must be just above the top of the plates, so that the plates stay covered."},{"n":5,"q":"To top up the electrolyte add:","o":["sulphuric acid","distilled water","sulphuric acid diluted with distilled water","boric acid"],"a":1,"e":"Top up with distilled water only. Water evaporates, the acid stays in the battery."},{"n":6,"q":"Non-spill vents are used on aircraft batteries to:","o":["prevent spillage of electrolyte during violent manoeuvres","stop spillage of the water only","prevent the escape of gases","prevent spillage during topping-up"],"a":0,"e":"Non-spill vents stop electrolyte escaping during violent manoeuvres or inverted flight."},{"n":7,"q":"The capacity of a lead acid battery is:","o":["determined by the area of the plates","determined by the active materials on the plates","determined by the size of the series coupling bars","determined by the number of separators"],"a":0,"e":"Capacity depends on the area of the plates. The active materials set the voltage."},{"n":8,"q":"Acid spillage in an aircraft can be neutralized by using:","o":["caustic soda","soap and water","soda and water","bicarbonate of soda and water"],"a":3,"e":"Acid is neutralised with an alkali: bicarbonate of soda and water. Caustic soda is too strong."},{"n":9,"q":"When the battery master switch is switched off in flight:","o":["the generators are disconnected from the bus bar","the ammeter reads maximum","the battery is isolated from the bus bar","the battery is discharged through the bonding circuit diodes"],"a":2,"e":"Switching the battery master off isolates the battery from the bus bar."},{"n":10,"q":"When the generator is on line the battery is:","o":["in parallel with the other loads","in series with the generator","in series when the generator is on line and is relayed when the generator is off line","load sharing"],"a":0,"e":"With the generator on line, the battery sits in parallel with the other loads on the bus bar and is charged."}]}]},{"id":"5","title":"Magnetism","grp":"DC","sections":[{"name":"Questions","qs":[{"n":1,"q":"The area of force around a magnet is termed:","o":["conductance","stable","magnetic resistance","magnetic field"],"a":3,"e":"The area around a magnet where its force acts is called the magnetic field."},{"n":2,"q":"When a magnet is unable to accept any further magnetism it is termed:","o":["reluctance","saturation","active","reactance"],"a":1,"e":"Saturation is the state where a magnet cannot accept any more magnetism."},{"n":3,"q":"Permanent magnets are manufactured from:","o":["steel","plastic","liquid","glass"],"a":0,"e":"Permanent magnets are made of steel, which keeps its magnetism."},{"n":4,"q":"Magnetic lines of force flow externally from:","o":["one main line station to another","the master station","the north to the south pole","in a random direction"],"a":2,"e":"Outside the magnet, lines of force flow from the north pole to the south pole."},{"n":5,"q":"Which of the two poles has the greatest strength?","o":["North seeking pole","South seeking pole","Both poles have the same strength","The saturated pole"],"a":2,"e":"Both poles of a magnet have exactly the same strength."},{"n":6,"q":"Electromagnetism is a product of:","o":["voltage","current","resistance","engine resistance"],"a":1,"e":"Electromagnetism is produced by current flowing in a conductor or coil."},{"n":7,"q":"To increase electromagnetic force one would:","o":["increase coil resistance","reduce current flow","lower EMF","increase current flow"],"a":3,"e":"A stronger electromagnet needs more current (or more turns). Increasing current flow does this."},{"n":8,"q":"If you bring two magnets together:","o":["like poles will attract","unlike poles will attract","over heating will occur","their magnetic fields will adjust to avoid overcrowding"],"a":1,"e":"Unlike poles (N and S) attract. Like poles repel."},{"n":9,"q":"A soft iron core in an electromagnet:","o":["increases flux density","decreases flux density","reduces arcing","increases the lines of strength"],"a":0,"e":"Soft iron has high permeability, so a soft iron core greatly increases the flux density of an electromagnet."}]}]},{"id":"6","title":"Generators and Alternators","grp":"DC","sections":[{"name":"Generator Theory","qs":[{"n":1,"q":"An EMF is induced in a conductor rotating in a magnetic field by:","o":["capacitive reaction","the reverse current relay","electro transmission","electromagnetic induction"],"a":3,"e":"Moving a conductor through a magnetic field induces an EMF in it. This is electromagnetic induction."},{"n":2,"q":"Magnetic field strength is controlled by:","o":["battery bus bar current","current in the field coil","current in the armature","current flow to the battery"],"a":1,"e":"Field strength depends on the current in the field coil. The voltage regulator controls that current."},{"n":3,"q":"If a conductor is placed in a magnetic field:","o":["an EMF is induced in the conductor","an EMF is induced in the conductor only when the conductor rotates","the applied resistance assists the back EMF","an EMF is induced in the conductor only when the conductor is stationary"],"a":1,"e":"An EMF is induced only when the conductor moves across (cuts) the magnetic field lines. A stationary conductor in a steady field gets none."},{"n":4,"q":"The output of a basic generator before commutation is:","o":["AC","DC and after commutation is AC","DC","synchronized AC and DC"],"a":0,"e":"A basic generator coil produces alternating current. The commutator then turns it into DC at the output."},{"n":5,"q":"An internally excited generator is one where:","o":["the field is produced within the distribution","the field is initiated by a HT and LT coil","the field is initiated by the battery","the field is initiated within the generator"],"a":3,"e":"An internally excited (self-excited) generator takes its field current from its own output, not from an outside source."},{"n":6,"q":"A DC generator has a commutator whose purpose is to:","o":["change AC to give a generator output of DC","change DC to AC","transmit the generator output to the electrical circuit and to cool the generator","maintain a constant resistance"],"a":0,"e":"The commutator changes the AC produced in the armature into a DC output."},{"n":7,"q":"Another name for a number of conductors rotating in a magnetic field is:","o":["a capacitor","an armature","a condenser","a commutator"],"a":1,"e":"The set of conductors rotating in the magnetic field is the armature."},{"n":8,"q":"A generator is governed so that:","o":["the EMF is constant and the rate of flow varies","the rate of flow is constant and the EMF varies","the generator voltage reduces generator temperature","back EMF is equal and opposite to the applied EMF"],"a":0,"e":"A generator is governed to keep the voltage (EMF) constant. The current varies with the load."},{"n":9,"q":"The voltage regulator:","o":["senses cut-out pressure and adjusts field current","senses generator output pressure and adjusts field current","senses generator output current and adjusts the field voltage","senses back EMF"],"a":1,"e":"The voltage regulator senses the generator output voltage and adjusts the field current to hold it steady."},{"n":10,"q":"The generator master switch is normally:","o":["fitted with a mechanical safety catch","in the field circuit which is connected in parallel with the generator output","in the field circuit which is in parallel with the voltage regulator","fitted in series with the commutator"],"a":1,"e":"The generator master (field) switch is in the field circuit. Opening it removes field excitation so the generator stops producing."}]},{"name":"Generator Control","qs":[{"n":1,"q":"The voltage regulator:","o":["provides a constant current flow from the generator with changes of generator speed","senses current output","maintains a steady generator voltage with changes of generator speed","regulates the amount of current supplied by the battery to operate the generator"],"a":2,"e":"The voltage regulator keeps the voltage steady despite changes of generator speed."},{"n":2,"q":"Voltage is controlled in a generator by:","o":["a reverse current relay","moving the brushes","a voltage regulator","it is uncontrollable"],"a":2,"e":"Generator voltage is controlled by the voltage regulator, which varies the field current."},{"n":3,"q":"On aircraft, generator voltage is regulated by:","o":["varying the generator field strength","increasing and decreasing the load","changing the generator speed","changing generator load"],"a":0,"e":"The regulator varies the generator field strength (field current), which changes the output voltage."},{"n":4,"q":"In an aircraft having a battery with a nominal voltage of 24 V, generator output would be:","o":["24 volts","28 amps","28 volts","24 amps"],"a":2,"e":"A 24 V battery is charged by a generator giving 28 V, which is higher than the battery voltage so it can push current in."},{"n":5,"q":"In DC electrical generating systems, the voltage regulator controls the system voltage within prescribed limits:","o":["regardless of varying engine RPM and electrical load, by varying the current in the generator field windings","by means of a relay which closes contacts in the output line when a certain RPM is reached","by temperature","by a variable resistance which limits the voltage given by the batteries"],"a":0,"e":"The regulator holds the voltage within limits whatever the engine RPM and load, by varying the field current."},{"n":6,"q":"A voltage regulator is fitted to:","o":["prevent high circulating currents","prevent backlash","to ensure correct voltage output to battery","to prevent battery feedback to the generator"],"a":2,"e":"The regulator keeps the generator output at the correct voltage, which is what the battery and the loads need."},{"n":7,"q":"If an aircraft electrical system is quoted as 24 volts DC, the output of the generator is:","o":["12 volts with the generators connected in series","28 volts with the generators connected in parallel","36 volts with the generators connected in series/parallel","42 volts"],"a":1,"e":"A \"24 V\" system actually runs at 28 V from generators connected in parallel to the bus bar."},{"n":8,"q":"If a circuit is designed for 12 volts, the generator will:","o":["give paralleled output only","give controlled 14 volts","14 volts wild DC","give controlled 12 volts"],"a":1,"e":"A 12 V system is supplied at a controlled 14 V so the battery can be charged."},{"n":9,"q":"The aircraft electrical generator output is controlled in flight by:","o":["sensing the generator output pressure","ram air","a resistance in the generator output circuit","the resistance of the armature circuit"],"a":0,"e":"The regulator senses generator output voltage (\"pressure\") and adjusts the field accordingly."},{"n":10,"q":"In a generator control circuit the strength of the magnetic field is controlled by:","o":["the commutator","the voltage regulator","the reverse current contactor","the output CB"],"a":1,"e":"The strength of the magnetic field is controlled by the voltage regulator, which varies the field current."}]}]},{"id":"7","title":"DC Motors","grp":"DC","sections":[{"name":"Questions","qs":[{"n":1,"q":"Rotary actuators are used for:","o":["undercarriage retraction","centre of gravity assessment","operation of fuel cocks","movement of control surfaces"],"a":2,"e":"Rotary actuators operate parts that turn, such as fuel cocks. Linear actuators move landing gear and flaps."},{"n":2,"q":"Actuator normal travel is controlled by:","o":["a clutch","limit microswitches","mechanical indicators","mechanical stops"],"a":1,"e":"Limit micro-switches cut the actuator motor when it reaches the end of its normal travel."},{"n":3,"q":"On a twin engined DC aircraft having two DC generators load sharing is achieved by:","o":["equalizing engine RPMs","an equalizing circuit to sense the difference and equalize the voltages of the two generators","synchronizing relays and voltage coil tuners","an equalizing circuit to sense the difference and equalize the field currents of the two generators"],"a":1,"e":"Load sharing is done by an equalising circuit that senses the voltage difference between the two generators and equalises it."},{"n":4,"q":"Pilots are informed of rotary actuator positions by:","o":["non-return valves","lights or doll’s eye indicators","travel indicators","veger counters"],"a":1,"e":"Pilots see rotary actuator positions on lights or doll's-eye indicators."},{"n":5,"q":"Press-to-test lights are used:","o":["to indicate to the pilot that the circuit has power and is complete","to control the movement of a rotary actuator","to indicate to the pilot that the circuit has operated","only to indicate to the pilot that the equipment has malfunctioned"],"a":0,"e":"Press-to-test lights show the pilot that the circuit has power and the bulb works."},{"n":6,"q":"A device for changing AC to DC is:","o":["an inverter","a rotary transformer","a rectifier","an alternator"],"a":2,"e":"A rectifier changes AC to DC. An inverter does the opposite."},{"n":7,"q":"An inching control is used in conjunction with:","o":["a linear actuator","a rotary actuator","a combination of linear and rotary actuator","a rectifier"],"a":0,"e":"An inching control moves a linear actuator in small steps, for example for flaps."},{"n":8,"q":"Friction clutches are fitted to actuators for:","o":["protection against mechanical overload","protection against brake on loads","protection against non-return valve failure","protection against supply failures"],"a":0,"e":"A friction clutch slips under excess load, protecting the actuator and its mechanism from mechanical overload."}]}]},{"id":"8","title":"Aircraft Electrical Power Systems","grp":"DC","sections":[{"name":"Generator Cut-out","qs":[{"n":1,"q":"In an electrical circuit the reverse current cut-out relay will open:","o":["when battery voltage exceeds generator voltage","when circuit voltage is less than generator voltage","when the main output CB is reset","when the batteries are flat"],"a":0,"e":"The reverse current cut-out opens when the battery voltage exceeds the generator voltage, so the battery cannot feed back into the generator."},{"n":2,"q":"A generator cut-out is provided:","o":["to prevent the battery over heating","to prevent the battery from being overcharged","to allow the generator to be isolated in a crash","to prevent discharge of the battery through the generator"],"a":3,"e":"The cut-out stops the battery discharging through the generator when generator voltage is lower than battery voltage."},{"n":3,"q":"A generator cut-out will open when:","o":["circuit loads equal the battery voltage","the air temperature reaches 45°C","circuit loads equal the generator voltage","generator voltage falls below battery voltage"],"a":3,"e":"It opens when the generator voltage falls below the battery voltage."},{"n":4,"q":"A generator cut-out is fitted to prevent:","o":["the battery discharging through the generator windings","the generator overcharging the battery","fire in the event of overloading the system","out of phasing"],"a":0,"e":"A cut-out is fitted to stop the battery discharging through the generator windings."},{"n":5,"q":"In the event of the cut-out points sticking in the closed position, the most probable results, when the engine stopped would be:","o":["gain of engine power","a burnt out generator","loss of residual magnetism","no apparent reaction"],"a":1,"e":"If the contacts stick closed after engine shutdown, the battery drives the generator as a motor and it burns out."},{"n":6,"q":"To prevent circulating currents when more than one generator is being connected to the same bus bar:","o":["reverse current relays are fitted","the generators are connected in series","rectifiers are fitted","differential cut-outs are used"],"a":3,"e":"The book's answer: differential cut-outs are used to avoid circulating currents between generators on one bus bar."},{"n":7,"q":"A generator cut-out is fitted:","o":["in series with the generator output","in the diode circuit","in parallel with the generator output","in the field circuit"],"a":0,"e":"The cut-out is in series with the generator output, since it connects and disconnects the generator from the bus."},{"n":8,"q":"On a 28 volt system with a 24 volt battery the cut-out contacts close at approximately:","o":["36 volts","24 volts","28 volts","26 volts"],"a":3,"e":"The contacts close when the generator voltage rises just above battery voltage (about 26 V for a 24 V battery)."},{"n":9,"q":"A component whose job is similar to a generator cut-out is:","o":["a rectifier.","a converter","an inverter","a reverse current relay"],"a":3,"e":"A reverse current relay does the same job as a generator cut-out: it prevents current flowing back into the generator."},{"n":10,"q":"If the cut-out is open, the battery is feeding the loads which are:","o":["in series with the battery","in parallel with the battery","in sequence with the cut-out","cross coupled"],"a":1,"e":"With the cut-out open, the loads are fed by the battery, wired in parallel with it."}]},{"name":"Generator Circuit 1","qs":[{"n":1,"q":"In a two-engine aircraft with two generators, there would be:","o":["one ammeter for each generator and one voltmeter switchable to indicate either generator voltage or battery voltage","one voltmeter for each generator. and one ammeter switchable to indicate either generator current or battery current","one ammeter showing the total output and one switchable voltmeter","one ammeter and one voltmeter each showing the average current and voltage output"],"a":0,"e":"Each generator has its own ammeter. One voltmeter is switched between each generator and the battery."},{"n":2,"q":"A generator converts mechanical energy to electrical by:","o":["electromagnetic spring action","electromagnetic induction","electrostatic induction","electrodynamic induction"],"a":1,"e":"A generator turns mechanical energy into electrical energy by electromagnetic induction."},{"n":3,"q":"In an aircraft electrical system which incorporates a voltmeter, the voltmeter indicates:","o":["the flow in the electrical system before the battery cut-out contacts close","the rate of flow at all times","the pressure in the electrical system before and after the cut-out contacts close","the flow in the electrical system after the battery cut-out contacts close"],"a":2,"e":"The voltmeter shows the electrical pressure (voltage) both before and after the cut-out contacts close."},{"n":4,"q":"If the generator warning light comes on in flight it indicates that:","o":["the generator is feeding the battery bus bar","the generator is not feeding the battery bus bar","the battery has failed","a rectifier is faulty"],"a":1,"e":"The generator warning light means the generator is not feeding the battery bus bar."},{"n":5,"q":"A generator failure is usually indicated by:","o":["the ammeter reading decreasing or showing a discharge and a red warning lamp lighting","the voltmeter reading increasing, the ammeter reading showing discharge and a red lamp lighting","the current consuming devices failing to operate","the motor speed increasing"],"a":0,"e":"Generator failure shows as a falling or discharge reading on the ammeter plus the red warning light."},{"n":6,"q":"A generator warning light will be illuminated:","o":["when the battery voltage exceeds that of the generator and the cut-out has opened","at night only","when the generator is supplying current to a fully charged battery, and no electrical loads are switched on","when the battery charge current is lower than required to maintain its fully charged state"],"a":0,"e":"The light comes on when battery voltage is higher than generator voltage, so the cut-out has opened."},{"n":7,"q":"If a generator fails in flight:","o":["the voltmeter will read maximum","the ammeter reading will decrease","load sharing circuits will operate","the watt metre will show an increase"],"a":1,"e":"If a generator fails, its ammeter reading drops (or shows discharge)."},{"n":8,"q":"If one generator fails you should:","o":["switch off the good generator","stop and feather the engine concerned","switch off the failed generator and continue normal use of the electrical system","switch off the failed generator, and cut down on the electrical services being used"],"a":3,"e":"Switch off the failed generator and cut down on services, because the remaining generator and battery must carry the load."},{"n":9,"q":"A generator is brought ‘on line’ when it is:","o":["connected in series with other generators","switched into the electrical circuit in parallel with the other generators","connected with the ground batteries for starting","connected to a phase reducer"],"a":1,"e":"A generator is on line when it is connected to the circuit in parallel with the other generators."},{"n":10,"q":"In a twin-engine aircraft, fitted with two generators, if one should fail:","o":["the failed generator must be isolated","cut down the air supply to reduce five risks","the failed generator must be stopped","both generators must be switched off"],"a":0,"e":"A failed generator must be isolated so it does not drag down the system or feed faults."}]},{"name":"Generator Circuit 2","qs":[{"n":1,"q":"A generator is brought ‘on line’ via the cut-out by an increase in:","o":["the battery voltage","the radio bypass switch","the generator voltage","the generator field voltage"],"a":2,"e":"The cut-out closes when the generator voltage rises above the battery voltage."},{"n":2,"q":"Generator failure is indicated by:","o":["load sharing circuits connecting","a decrease or discharge in ammeter readings and generator warning light on","an increase in voltmeter readings, a discharge in ammeter reading and generator warning light on","failure of electrically driven instruments"],"a":1,"e":"A failure shows as a drop or discharge on the ammeter and the generator warning light on."},{"n":3,"q":"In a twin-engine aircraft, with a generator fitted to both engines, the starboard generator fails. Then:","o":["the starboard engine cuts","the port engine cuts","both engines run normally","the engine with the failed generator will automatically feather"],"a":2,"e":"Engines run independently of generators, so a generator failure does not stop either engine."},{"n":4,"q":"Loads on a bus bar are:","o":["in series with the generator so that the voltage can be reduced","in parallel so the voltage can be varied","in parallel so the current can be reduced","determined by the cross-sectional area of the lead cable"],"a":2,"e":"Loads are in parallel on the bus bar, so each load gets the same voltage and the total current is shared."},{"n":5,"q":"When the battery master switch is switched off in flight:","o":["the generators are disconnected from the bus bar","the battery is isolated from the bus bar","the battery is discharged through the bonding circuit diodes","the battery may overheat"],"a":1,"e":"The battery master switch isolates the battery from the bus bar. The generators stay connected."},{"n":6,"q":"A generator is taken ‘off’ line by:","o":["the battery switch","closing of the field switch","opening of the cut-out","removing all loads"],"a":2,"e":"The generator is taken off line by the cut-out opening."},{"n":7,"q":"If the ammeter reads plus 5 amp after engine shut down:","o":["some switches have been left ‘on’","the battery is charging","the generator field switch is ‘on’","the ammeter is defective"],"a":3,"e":"With the engine stopped, the battery cannot be charging, so a +5 A reading means the ammeter is faulty."},{"n":8,"q":"If the ammeter shows ‘no’ charge, yet the battery remains charged, you would look for:","o":["loose battery connections","a defective voltage regulator","a defective CB","a defective ammeter"],"a":3,"e":"If the battery stays charged although the ammeter shows no charge, suspect the ammeter."},{"n":9,"q":"A field switch in the generator circuit is:","o":["kept in the ‘on’ position","connected in the armature circuit","to ‘shut off’ the generator field","to disconnect the battery"],"a":2,"e":"The field switch shuts off the generator field, so the generator stops producing."},{"n":10,"q":"During flight a malfunction of the generator cut-out would be indicated by:","o":["overheating of the battery","the ammeter","lights going out","the current limiter"],"a":1,"e":"The ammeter shows a cut-out malfunction: current reads abnormally (for example reverse or zero)."}]},{"name":"Distribution","qs":[{"n":1,"q":"A short circuit in a “single pole” electrical circuit would be caused:","o":["by a broken conductor between the source of supply and an item of equipment","by an open circuit between loads in parallel","when wiring between the source of supply and an item of equipment goes down to earth","by an open circuit between an item of equipment and earth"],"a":2,"e":"In a single-pole (earth return) circuit, a short circuit happens when the live wire touches the aircraft structure."},{"n":2,"q":"In a “2 pole” electrical circuit, a short of the conductors would result in:","o":["an item of equipment operating automatically without switches","the component not working","an increase in voltage","an item of equipment burning out because of a large current flow"],"a":1,"e":"The book's answer: in a two-pole circuit, bridging the conductors shorts out the load so the component stops working. The fuse would also blow."},{"n":3,"q":"The indicating range of an ammeter can be increased by fitting:","o":["a shunt fitted in parallel with the instrument","a shunt fitted in parallel with the load","a shunt fitted in series with the instrument","a multiplier fitted in parallel with the instrument"],"a":0,"e":"An ammeter shunt is wired in parallel with the instrument, so part of the current bypasses it and the range increases."},{"n":4,"q":"An electrical system which uses the aircraft structure as a return path for current is known as:","o":["a diode pole circuit","an earth return circuit","a single phase circuit","a dipole circuit"],"a":1,"e":"A system using the airframe as the return path is an earth return (single pole) circuit."},{"n":5,"q":"On a single pole circuit, if the positive conductor is shorted to the aircraft structure:","o":["the electrical component will operate","the fuse will blow","the circuit will be under loaded","the load will only operate at half speed"],"a":1,"e":"If the positive conductor touches the structure, a large current flows to earth and the fuse blows."},{"n":6,"q":"In a double pole circuit:","o":["the systems polarity will change","the current is supplied by one wire and the current is returned through the aircraft bonding system","the current passes out through one wire and is returned through a second wire","the current passes out through one wire and is returned via the aircraft’s immune circuit"],"a":2,"e":"A double pole (dipole) circuit uses two wires: one carries current out, the other brings it back."},{"n":7,"q":"In an earth return circuit if the conductor is open circuited:","o":["the fuse will blow","the bus bars will overheat","the load will not operate","the generator will burn out"],"a":2,"e":"If the conductor is open circuit, the circuit is broken, no current flows and the load does not work."},{"n":8,"q":"A ‘hot bus’ is:","o":["the bus bar always connected to the battery","the bus bar that supplies the galley power","the bus bar that supplies the essential loads","the bus bar that supplies the non-essential loads"],"a":0,"e":"The hot bus is the bus bar permanently connected to the battery, so it stays live even with the master switch off."},{"n":9,"q":"A dipole circuit is one where:","o":["diode valves are used","three conductors are used","the aircraft structure is used for the earth return","two conductor wires are used"],"a":3,"e":"A dipole circuit uses two conductor wires, one out and one back."}]}]},{"id":"9","title":"Bonding and Screening","grp":"DC","sections":[{"name":"Questions","qs":[{"n":1,"q":"Why are static wick dischargers fitted to aircraft?","o":["To smooth the generator output","To prevent tyres bursting on landing","To minimize radio interference","To act as an earth return in a single pole electrical system"],"a":2,"e":"Static wicks discharge static electricity from the airframe, which cuts down radio interference."},{"n":2,"q":"Bonding is used to protect the aircraft against fire from arcing of static electricity by:","o":["providing an earth return","shortening the negative strips","maintaining different electrical potential throughout the structure","ensuring the same electrical potential of all metal components"],"a":3,"e":"Bonding keeps all metal parts at the same electrical potential, so no sparks can jump between them."},{"n":3,"q":"Static electricity constitutes a fire hazard because:","o":["metal components become very hot and ignite inflammable gases and materials","sparks occur due to differences of potential and could ignite inflammable gases and materials","of colour charged electrons","aircraft tyres become heavily charged and may burst on landing"],"a":1,"e":"Static builds up potential differences, and the resulting sparks can ignite fuel vapour and other flammable materials."},{"n":4,"q":"Static electrical charges and currents in an aircraft structure are evened out by:","o":["hardening","screening","bonding","anodizing"],"a":2,"e":"Bonding connects all metal parts so charges and currents are evened out across the structure."},{"n":5,"q":"The electrical components of aircraft systems are screened to:","o":["bond the circuit to reduce risk of fire","prevent them discharging","prevent short circuits in radio equipment","prevent them interfering with the function of radio equipment"],"a":3,"e":"Screening shields electrical components so they do not interfere with radio equipment."},{"n":6,"q":"Bonding is a method of:","o":["heat screening","providing a positive reaction","ensuring that the different parts of the aircraft are maintained at a different potential","ensuring that the different parts of the aircraft are maintained at the same potential"],"a":3,"e":"Bonding keeps the different parts of the aircraft at the same potential."},{"n":7,"q":"The purpose of electrical bonding on an aircraft is:","o":["to prevent compass malfunctioning and accumulation of local static charges","to reduce the anodizing effect","to isolate all components electrically and therefore make static potential constant","to provide a low resistance path for earth return circuits and safely dissipate local static charges and lightning strikes"],"a":3,"e":"Bonding gives a low resistance path for earth returns and safely dissipates static charges and lightning strikes."}]}]},{"id":"10","title":"Specimen Questions","grp":"DC","sections":[{"name":"General 1","qs":[{"n":1,"q":"Spare fuses are carried:","o":["at the operators’s discretion","for generators only","by law with a stated minimum number required","by the first officer"],"a":2,"e":"By law a stated minimum number of spare fuses must be carried."},{"n":2,"q":"When selecting a fuse for a circuit the governing factor is:","o":["the voltage of the circuit","the fuse length and diameter","the resistance of the circuit","the power requirement of the circuit"],"a":3,"e":"A fuse is chosen from the power requirement of the circuit (current = P / V)."},{"n":3,"q":"Differential cut-outs close when a differential voltage exists between the:","o":["generator bus and battery bus bar","generator bus bar and earth","batteries","battery bus bar and earth"],"a":0,"e":"Differential cut-outs close when there is a voltage difference between the generator bus bar and the battery bus bar."},{"n":4,"q":"Circulating current is the term used to describe:","o":["back EMF","current necessary to excite the generator","current passing between two paralleled generators of differing voltage","current passing between AC and DC systems"],"a":2,"e":"Circulating current flows between paralleled generators whose voltages differ."},{"n":5,"q":"A megohm is:","o":["10 000 ohms","1000 ohms","1 000 000 ohms","1 000 000 000 ohms"],"a":2,"e":"A megohm is one million ohms (1 000 000 Ω)."},{"n":6,"q":"Load shedding is:","o":["transferring the loads between generators","reducing the load voltage","overall reduction of electrical load on the system","overall reduction of generator voltages"],"a":2,"e":"Load shedding is an overall reduction of the electrical load on the system, for example after a generator failure."},{"n":7,"q":"When a generator is on line and its associated ammeter reads 10 amps, this is an indication of:","o":["BTBs being energized","battery charge rate","battery discharge rate","generator load"],"a":3,"e":"The ammeter on a generator on line shows that generator's load. The battery charge rate is shown by a different ammeter."},{"n":8,"q":"The formula for calculating power is:","o":["V² / R  or  I² × R  or  I × V","V² / R  or  I × R  or  I × V","V / R²  or  I² × R  or  I² × V","V / R²  or  I × R²  or  I × V"],"a":0,"e":"P = V × I = I² × R = V² / R. All three forms are equivalent."},{"n":9,"q":"Assuming a 5 amp circuit has failed during flight and investigation has shown that the fuse is open circuit, the action to be taken is to:","o":["switch the circuit off immediately","switch off, replace the fuse with another of the correct rating for the circuit and repeat this action as often as necessary","leave the switch on, replace the failed fuse with one of increased rating","switch off, replace the failed fuse with one of the correct rating once only"],"a":3,"e":"Replace the failed fuse once only, with one of the correct rating. A second failure means a real fault."},{"n":10,"q":"If the voltage in a circuit is doubled, the current will:","o":["double","increase only if the battery is in circuit","remain the same","decrease"],"a":0,"e":"Current is proportional to voltage (I = V / R), so double the voltage gives double the current."},{"n":11,"q":"A simple electrical circuit has a current flow of 4 amperes and its resistance is 5 ohms. How much power (watts) is used?","o":["20 watts","45 watts","80 watts","100 watts"],"a":2,"e":"P = I² × R = 4² × 5 = 16 × 5 = 80 W. Check: V = 4 × 5 = 20 V, P = 20 × 4 = 80 W."},{"n":12,"q":"Check a lead acid battery voltage:","o":["only if a fault is suspected","on load with a voltmeter","on no load with a voltmeter","on open circuit with a voltmeter"],"a":1,"e":"Check lead-acid battery voltage on load with a voltmeter. An unloaded reading hides weakness."},{"n":13,"q":"Connecting two batteries in series will:","o":["increase the voltage and capacity","have no effect","decrease the voltage and the capacity","increase the voltage, the capacity will remain the same"],"a":3,"e":"In series, voltages add and capacity stays the same."},{"n":14,"q":"An aircraft has a battery with a capacity of 60 Ah. Assuming that it will provide its nominal capacity and is discharged at the 10 hour rate:","o":["it will pass 60 amperes for 10 hours","it will pass 10 amperes for 6 hours","it will pass 6 amperes for 10 hours","it will pass 60 amperes for 1 hour"],"a":2,"e":"At the 10-hour rate, a 60 Ah battery gives 60 / 10 = 6 A for 10 hours."},{"n":15,"q":"A NiCad battery shows a high temperature after engine start, this could be an indication of:","o":["thermal runaway","it is not connected to the battery bus bar","normal temperature during charging","depends upon the outside air temperature"],"a":0,"e":"A NiCad battery that gets hot after engine start may be in thermal runaway: heating lowers its resistance, current rises, so it heats more."},{"n":16,"q":"When generators are connected in parallel their output voltage must be:","o":["divided by the circuit resistance","the same","added together","controlled by one generator"],"a":1,"e":"Paralleled generators must have the same output voltage, otherwise a circulating current flows between them."}]},{"name":"General 2","qs":[{"n":1,"q":"In a direct current generating system the voltage regulator controls the system voltage within prescribed limits:","o":["regardless of varying engine RPM and electrical load by inserting a variable resistance in the generator field winding","by means of a relay which closes contacts in the output circuit when a prescribed voltage is reached","of the generator rotor speed","by a variable resistance which limits the voltage given by the battery"],"a":0,"e":"The regulator holds system voltage steady despite changing RPM and load by varying the resistance (current) in the generator field."},{"n":2,"q":"A generator cut-out is fitted:","o":["to isolate the battery on touchdown","to prevent the battery from being overcharged","to allow the generator to be isolated in a crash","to prevent the battery feeding back into the generator when its voltage is above the generator voltage"],"a":3,"e":"The cut-out prevents the battery feeding back into the generator when generator voltage falls below battery voltage."},{"n":3,"q":"A generator cut-out contacts will close:","o":["with an increase in battery voltage","with an increase in generator voltage","at flight idle only","with an increase in generator current"],"a":1,"e":"The contacts close when generator voltage rises above battery voltage."},{"n":4,"q":"Failure of an aircraft generator is indicated by:","o":["a red warning light lighting and the ammeter showing zero or discharge","a red warning light going out and the ammeter showing a discharge","a current limiter tripping","a circuit fuse blowing"],"a":0,"e":"A failed generator shows the red warning light on and the ammeter at zero or discharge."},{"n":5,"q":"On a twin-engine aircraft with a generator fitted to each engine, if the starboard generator fails,:","o":["the fuel cross feed cocks close","the starboard engine cuts (stops)","the port engine will cut","both engines will run normally"],"a":3,"e":"The engines do not depend on the generators, so both keep running normally."},{"n":6,"q":"On an earth return aircraft wiring circuit:","o":["the negative pole is connected to the aircraft structure","the positive pole is connected to the aircraft structure","the negative pole is connected to the positive pole","two fuses are needed"],"a":0,"e":"In an earth return circuit the negative pole is connected to the aircraft structure."},{"n":7,"q":"In a dipole aircraft wiring circuit if the conductors are bridged:","o":["an item of electrical equipment would be burned out","no immediate action is necessary","the item of electrical equipment would operate normally","the fuse or circuit breaker in that circuit will blow"],"a":3,"e":"If a dipole circuit's conductors are bridged (short circuit), the fuse or circuit breaker blows."},{"n":8,"q":"A circuit breaker that has tripped due to overload:","o":["cannot be reset unless the circuit has returned to normal","will not be able to be reset in the air","will reset itself when the circuit returns to normal","must be replaced"],"a":0,"e":"A tripped breaker can only be reset when the circuit has returned to normal (the fault is gone)."},{"n":9,"q":"When changing a blown fuse:","o":["it is changed with one of a lower rating","the press to reset button is operated","leave circuit switched on","it is changed with one of the correct rating"],"a":3,"e":"A blown fuse must be replaced with one of the correct rating, never a different one."},{"n":10,"q":"As the speed of an electric motor increases the back EMF will:","o":["remain the same","fluctuate","increase","decrease"],"a":2,"e":"Back EMF is proportional to speed, so as a
